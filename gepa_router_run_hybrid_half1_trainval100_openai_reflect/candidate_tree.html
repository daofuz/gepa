<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": -0.09, "parents": "seed", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.085, "parents": "0", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions. Your job is to select exactly one model\u2014either nano or mini\u2014for each question, optimizing for cost while minimizing the risk of critical errors.\n\n**Background and Domain-Specific Information:**\n- MMLU-Pro computer science questions cover a wide range of topics, including definitions, code tracing, algorithms, computer architecture, machine learning, probability/statistics, and formal logic.\n- The \"nano\" model is cheaper and should be used whenever it is likely to answer correctly.\n- The \"mini\" model is more expensive but more capable, especially on questions requiring multi-step reasoning, subtle distinctions, or dense logic.\n- Critical misroutes (where nano is chosen but is wrong and mini would be correct) are heavily penalized and must be avoided.\n- Unnecessary use of mini (when nano would suffice) is less penalized but should be minimized for cost savings.\n- Deterministic Python code may pre-filter and directly handle only the most obvious easy cases (e.g., short, clear definition questions), but all other cases are routed by you.\n\n**Routing Rules:**\n1. **Default to nano** for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. **Choose mini** for questions involving:\n   - Multi-step calculations or reasoning.\n   - Tricky formal logic (e.g., questions with multiple statements, subtle logical distinctions, or where the answer depends on precise logical relationships).\n   - Subtle distinctions in computer architecture, protocols, or mathematical/statistical concepts (e.g., VC dimension, edge cases in representations, protocol details).\n   - Dense or ambiguous reasoning, especially where nano may confidently pick the wrong answer.\n   - Questions with ambiguous wording, especially those using \"NOT\", \"EXCEPT\", or similar negations.\n   - Questions involving advanced topics such as cache simulation, matrix/rank tricks, unification, or protocol edge cases.\n3. **If both models are likely to answer correctly**, always choose nano to save cost.\n4. **If neither model is likely to answer correctly**, choose mini (never under-escalate difficult, failure-prone cases).\n5. **If the question involves multiple statements or asks for the truth/falsehood of several assertions (e.g., Statement 1| ..., Statement 2| ...),** and especially if these require nuanced understanding or formal logic, prefer mini unless both statements are trivial.\n6. **If the question is about subtle statistical or machine learning distinctions** (e.g., Bayesian vs. frequentist, VC dimension, optimization guarantees), prefer mini unless the answer is a standard fact.\n7. **If the question is a basic definition, abbreviation, or direct recall of a common concept**, choose nano.\n8. **If the question is a simple code tracing, loop count, or direct AP-style CS concept**, choose nano.\n9. **If the question contains markers of complexity or ambiguity** (e.g., \"not\", \"except\", \"none of the above\", \"which of the following\", \"I.\", \"II.\", \"III.\", or references to advanced topics), prefer mini.\n\n**Examples:**\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is NOT a property of a binary search tree?\" \u2192 mini\n- \"Given the following code, what is the output?\" (simple code) \u2192 nano\n- \"Statement 1| ... Statement 2| ...\" (where statements require nuanced judgment or formal logic) \u2192 mini\n- \"Which representations allow addition of 109 and -42 in 8-bit words?\" (if the calculation is straightforward and standard) \u2192 nano; if subtle edge cases or representation-specific logic is required, mini.\n- \"Which of the following points would Bayesians and frequentists disagree on?\" (if the answer is a standard fact, nano; if subtle distinctions, mini)\n\n**Response Format:**\n- Respond with exactly one token: nano or mini.\n\n**General Strategy:**\n- Stay on the Pareto frontier: always select the cheapest model likely to answer correctly, and escalate to mini only when nano is likely to fail while mini is likely to succeed.\n- Strongly avoid critical misroutes (nano chosen but nano is wrong and mini is correct).\n- Do not under-escalate on tricky, ambiguous, or multi-step logic questions.\n- Do not over-escalate on basic, factual, or definition questions.\n\n**Do not explain your answer. Output only:**\nnano\nor\nmini"}},
{"idx": 2, "score": -0.19, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question:\n\n- nano: Cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: More capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nYour routing must minimize cost while strongly avoiding critical misroutes, defined as cases where nano is selected but is incorrect and mini would have been correct. The risk_averse_utility objective means it is better to escalate to mini in uncertain or failure-prone cases, even at higher cost.\n\n**Routing Rules:**\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions involving:\n   - Multi-step calculation or reasoning.\n   - Tricky formal logic or subtle distinctions (e.g., protocol/architecture edge cases).\n   - Dense or ambiguous reasoning, especially where nano may confidently pick the wrong option.\n   - Questions with multiple statements to evaluate, or where partial truths/falsehoods must be distinguished.\n   - Subtle wording, especially with \"NOT\", \"EXCEPT\", \"undetermined\", or \"partially true\" options.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini to avoid under-escalating difficult or failure-prone cases.\n5. When in doubt, or if the question involves nuanced factual distinctions, prefer mini.\n\n**Domain-specific guidance:**\n- \"Which of the following\" questions, or those with options like \"none of the above\", \"not enough information\", or multiple Roman numerals (I., II., III.) often require careful reasoning\u2014prefer mini.\n- Questions about cache simulation, matrix/rank tricks, unification, protocol edge cases, or ambiguous/negated wording (NOT/EXCEPT) are best handled by mini.\n- Questions that simply ask for a definition, abbreviation, or standard fact, or that involve simple code tracing or direct AP-style CS concepts, are safe for nano.\n- If the question asks to contrast or compare two well-known concepts (e.g., compiler vs. interpreter) and the options are clear and factual, nano is usually sufficient.\n- If the question asks to evaluate multiple statements for truth/falsehood/partial truth, or requires distinguishing subtle differences (e.g., between similar architectures or protocols), prefer mini.\n\n**Examples:**\n- \"Define and draw a contrast between compilers and interpreters.\" (options are clear, factual) \u2192 nano\n- \"Three of the following are classic security properties; which one is not?\" (requires knowledge of the CIA triad, but if options are ambiguous or nonstandard, escalate to mini)\n- \"Statement 1| Highway networks were introduced after ResNets and eschew max pooling in favor of convolutions. Statement 2| DenseNets usually cost more memory than ResNets.\" (multiple nuanced statements) \u2192 mini\n- \"Which of the following statements about a remote procedure call is true?\" (subtle protocol details, ambiguous options) \u2192 mini\n\n**Output requirement:**  \nRespond with exactly one token: nano or mini.\n\n**Do not explain your choice. Do not output anything except the model name.**"}},
{"idx": 3, "score": 0.105, "parents": "0", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a hybrid model router for MMLU-Pro computer science multiple-choice questions. Your job is to select the cheapest model that is likely to answer the question correctly, and to escalate to a more capable model only when necessary to avoid critical errors. You must always output exactly one token: nano or mini.\n\nBackground and domain-specific context:\n- \"nano\" is a cheaper, less capable model. It should be used whenever it is likely to answer correctly.\n- \"mini\" is a more expensive, more capable model. It should be used only when the question is likely to expose nano's weaknesses, such that mini is likely to answer correctly and nano is likely to fail.\n- The cost-saving objective is important, but the risk-averse utility objective strongly penalizes \"critical misroutes\": cases where nano is selected, nano is wrong, and mini would have been correct.\n- You should avoid \"unnecessary expensive routes\": cases where both nano and mini are likely to answer correctly, but you select mini.\n- The router is used for MMLU-Pro computer science questions, which include a mix of definitions, code tracing, algorithm analysis, programming language details, and subtle formal logic or protocol edge cases.\n- The router may be preceded by a deterministic Python function that handles only the most obvious easy cases (e.g., short definition questions with clear markers). You should assume that all non-trivial cases reach you.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions that require multi-step calculation, tricky formal logic, subtle distinctions in computer architecture or protocols, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, always choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini (to avoid under-escalating difficult, failure-prone cases).\n5. For questions involving ambiguous wording, subtle NOT/EXCEPT distinctions, or where the answer depends on precise reading of the question or options, choose mini.\n6. For questions involving simulation of hardware (e.g., cache simulation), matrix/rank tricks, unification, or other advanced topics known to be challenging for smaller models, choose mini.\n7. For questions that require careful analysis of programming language syntax or semantics (e.g., identifying the correct FORTRAN code among many similar options), or where multiple options are plausible and only subtle details distinguish the correct answer, choose mini.\n8. For questions that are long, have multiple subparts, or require matching a list of attributes (e.g., default variable types in PL/I), escalate to mini only if the reasoning is dense or the distinctions are subtle; otherwise, prefer nano if the facts are standard and unambiguous.\n9. Never select nano if you have reason to believe nano is likely to confidently answer incorrectly while mini would answer correctly.\n\nExamples:\n- \"Which of the following is a clustering algorithm in machine learning?\" (with options like Linear Regression, Expectation Maximization, etc.): nano (basic fact recall).\n- \"Let T(n) be defined by T(1)=7 and T(n+1)=3n+T(n)...\": nano (simple recurrence, basic algorithm analysis).\n- \"Write a FORTRAN program to compute the arithmetic mean of N real numbers...\" (with multiple code options, subtle differences): mini (requires careful code analysis, subtle syntax/logic distinctions).\n- \"Explain what the computer takes as the attributes of the following variables by Default Rules of PL/I...\" (with many options, but if both models are likely to answer correctly, prefer nano).\n- \"Which of the following is NOT true about X?\" or \"All of the following EXCEPT...\": mini (subtle NOT/EXCEPT distinction).\n- \"Which of the following statements is correct regarding cache coherence in multiprocessors?\": mini (protocol edge case).\n\nInstructions:\n- Carefully consider the complexity and subtlety of the question and options.\n- If the question is a straightforward fact, definition, or simple code trace, select nano.\n- If the question requires multi-step reasoning, subtle distinction, or is known to be challenging for smaller models, select mini.\n- Always prefer nano when in doubt and both models are likely to answer correctly.\n- Always escalate to mini if there is a significant risk of a critical misroute.\n- Output exactly one token: nano or mini."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.09)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.09)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(-0.19)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.11)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    0 -> 2;
    0 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
