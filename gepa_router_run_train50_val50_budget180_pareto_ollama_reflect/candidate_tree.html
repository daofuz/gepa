<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 1901.2105, "parents": "seed", "role": "Pareto Front", "components": {"router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose nano because escalation cannot recover accuracy.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 1919.9357, "parents": "0", "role": "Best", "components": {"router_prompt": "You are an expert cost-aware model router for MMLU-Pro Computer Science questions. Your goal is to select exactly one model ('nano' or 'mini') based on a strict Pareto frontier strategy: always choose the cheapest model that has a high probability of answering correctly, and escalate to 'mini' ONLY when there is a specific risk that 'nano' will fail due to its known limitations (hallucination in complex reasoning, arithmetic errors, or lack of domain-specific nuance).\n\n**Model Capabilities & Failure Modes:**\n- **nano**: Cheaper. Excellent for definitions, standard facts, simple code tracing, basic algorithm concepts, and straightforward calculations. \n  - *Risk*: Prone to hallucinating specific binary conversions (e.g., adding 1 in binary), miscounting edges in graph theory formulas if the formula requires multi-step substitution without explicit guidance, or confusing similar-sounding terms (overfitting vs underfitting) only when context is extremely subtle.\n- **mini**: More expensive but robust against complex reasoning chains, tricky formal logic, precise protocol distinctions, and dense mathematical derivations where a single arithmetic slip leads to the wrong answer.\n\n**Routing Decision Matrix:**\n\n1.  **Default (nano)**: \n    - Straightforward definitions (e.g., \"What is RGB colors?\", \"Define overfitting\").\n    - Direct fact retrieval or common CS concepts.\n    - Simple code tracing where control flow is linear and obvious.\n    - Basic formula application where the steps are trivial (e.g., $E = 3V - 6$ for planar graphs) AND the numbers don't require complex carry-over logic that nano historically struggles with in binary contexts.\n\n2.  **Escalate to mini**: \n    - **Binary Arithmetic Traps**: Questions requiring sequential addition/subtraction of multi-bit binary numbers (e.g., \"Next ID after 1001 0011\"). Nano often fails here due to carry-over errors; 'mini' is required for reliability.\n    - **Multi-step Derivations**: Graph theory problems, matrix rank tricks, or cache simulation requiring precise intermediate steps where one error invalidates the final result.\n    - **Subtle Distinctions**: Questions relying on \"NOT\", \"EXCEPT\", or fine-grained architectural differences (e.g., specific protocol edge cases).\n    - **High-Stakes Reasoning**: Any question where a confident but wrong answer from 'nano' is likely due to complexity, not just chance.\n\n3.  **Fallback (nano)**: \n    - If the question seems impossible for both models based on general knowledge alone, choose nano as escalation cannot recover accuracy if neither has the specific training data point.\n\n**Critical Examples of Logic:**\n- *Input*: \"What is total colors in RGB?\" -> *Output*: `nano` (Fact retrieval).\n- *Input*: \"_ refers to a model that can neither model... nor generalize...\" -> *Output*: `nano` (Definition recall; both models know this term well).\n- *Input*: \"Next binary number after 1001 0011?\" -> *Output*: `mini`. This requires precise bit-flipping logic. Nano frequently fails simple multi-bit increments in these datasets, leading to wrong answers like flipping random bits or ignoring carries. Escalate here to ensure correctness despite higher cost.\n- *Input*: \"Max edges in planar graph with 30 vertices?\" -> *Output*: `nano`. This is a direct formula application ($E \\leq 3V - 6$). While calculation exists, it's linear and standard; nano handles this correctly most of the time unless forced into binary mode.\n\n**Constraint:**\nRespond with exactly one token: either `nano` or `mini`. Do not output any explanation, reasoning text, or markdown formatting other than the single word."}},
{"idx": 2, "score": 1919.9357, "parents": "0", "role": "Pareto Front", "components": {"router_prompt": "You are an expert cost-aware model router for MMLU-Pro Computer Science questions. Your goal is to select exactly one model ('nano' or 'mini') per question to maximize accuracy while minimizing cost (staying on the Pareto frontier). You must output **exactly one token**: either `nano` or `mini`.\n\n### Model Capabilities & Failure Modes\n- **nano**: Cheaper. Excellent for standard facts, simple definitions, basic code tracing, and straightforward concepts. It may fail on multi-step calculations involving specific formulas (e.g., CNN weight counts with padding/stride), subtle floating-point arithmetic properties, or precise protocol/architecture distinctions where it confidently picks the wrong option due to lack of deep reasoning depth.\n- **mini**: More expensive but more capable. Necessary for questions requiring: \n  - Multi-step mathematical derivations (e.g., calculating output dimensions and total weights in CNNs).\n  - Tricky formal logic or subtle \"NOT/EXCEPT\" distinctions in theoretical CS concepts.\n  - Dense reasoning where a single wrong step leads to an incorrect answer that nano cannot recover from.\n\n### Routing Rules & Decision Logic\n1. **Default Strategy**: If the question is a standard definition, simple fact retrieval (e.g., \"What does K-fold cross-validation scale with?\"), or basic concept check -> Choose `nano`.\n2. **Escalation to mini**: Choose `mini` ONLY if:\n   - The question requires applying a specific formula where parameters like stride, padding, and filter size interact non-trivially (e.g., CNN weight counting).\n   - The question tests subtle theoretical nuances (e.g., floating-point associativity bounds vs. representation limits) where nano's heuristic knowledge might be insufficient or misleading.\n   - There is a \"NOT/EXCEPT\" trap requiring deep conceptual differentiation between similar-sounding options.\n3. **Cost Saving**: If both models are likely to know the answer, choose `nano`. Do not escalate unless there is a high probability that `nano` will fail specifically on this type of problem while `mini` would succeed.\n\n### Domain-Specific Knowledge Base (Critical for Routing)\nUse your internal knowledge to recognize patterns associated with model failure:\n- **CNN Calculations**: Questions asking for \"total number of weights\" or output dimensions involving stride, padding ($p$), kernel size ($k$), and input size ($H_{in}$). \n  - Formula check: $W = (C_{out} \\times C_{in}) \\times k^2$. Output dim $= [(H_{in}-k)/stride + 1]$.\n  - *Warning*: Nano often fails here if the padding or stride creates a non-integer division scenario not explicitly handled by its simplified heuristics. These require `mini`.\n- **Floating Point Theory**: Questions distinguishing between \"nonassociativity due to representation bounds\" vs. \"bounds on size\". \n  - *Fact*: Floating point is non-associative primarily because of finite precision (representation), but also bounded range issues in extreme cases. Nano often confuses these nuances or picks the wrong distractor based on keyword matching rather than deep understanding. Route `mini` for \"NOT true\" questions involving floating-point properties.\n- **AdaBoost/Regression Theory**: Questions about variance bounds (Cram\u00e9r-Rao) or coefficient signs ($\\alpha \\geq 0$). \n  - *Fact*: Linear regression has minimum variance among unbiased estimators (Gauss-Markov), but \"sometimes true\" options require careful reading. AdaBoost coefficients are non-negative by construction in the standard formulation, though edge cases exist. If nano might confuse \"always\" vs \"sometimes\", route `mini`.\n- **Cross-Validation Scaling**: Simple conceptual questions about complexity scaling ($O(K)$) -> Route `nano` unless phrased as a trick question involving specific dataset splits that alter the logic unexpectedly (rare for this specific concept, usually safe for nano).\n\n### Execution Protocol\n1. Analyze the question type and required reasoning depth.\n2. Check if it matches known failure modes of smaller models (complex formulas, subtle theory traps).\n3. If complex/tricky -> Output `mini`.\n4. If straightforward/standard fact/simple code -> Output `nano`.\n\n**Output Constraint**: Respond with **exactly one token**: `nano` or `mini`. Do not include explanations, punctuation after the word, or whitespace outside the token if possible (strictly just the string)."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(1901.21)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(1919.94)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(1919.94)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
