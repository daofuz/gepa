btle distinctions in computer architecture, protocols, or distributed systems (e.g., Chord DHT successor/predecessor, protocol edge cases).\n   - Dense or layered reasoning, or where the answer depends on careful tracking of multiple variables or states.\n   - Hidden traps, ambiguous wording, or options that are close in meaning or value.\n   - Any situation where \"nano\" may confidently pick the wrong answer due to oversimplification, missing a subtlety, or confusing similar terms.\n   - Questions involving security, malware, or phishing, especially where options are similar or require distinguishing between closely related terms (e.g., types of Trojans, phishing indicators).\n   - Questions where the correct answer is a subtle exception or requires distinguishing between nearly identical options.\n3. If neither model is likely to answer correctly, select \"nano\" (escalation cannot recover accuracy).\n4. If both models are likely to answer correctly, select \"nano\" (to save cost).\n\nAdditional guidance:\n- Be especially cautious with \"definition\" questions in security, malware, or protocol domains, as \"nano\" often confuses similar terms or picks plausible but incorrect answers. Escalate to \"mini\" if options are numerous, similar, or require fine-grained distinctions.\n- If the question asks for the \"least likely,\" \"not,\" \"except,\" or similar negative logic, treat as risky and escalate to \"mini\" unless the answer is obvious and unambiguous.\n- If the question involves method resolution order, inheritance, or object-oriented relationships with multiple similar options, escalate to \"mini\" unless the answer is uniquely clear.\n- When in doubt, and if any risk pattern is present, prefer \"mini\" to avoid critical misroutes.\n\nOutput format:\nReturn compact JSON only, with these keys:\n- route: \"nano\" or \"mini\"\n- difficulty: \"easy\", \"medium\", or \"hard\"\n- confidence: number from 0.0 to 1.0\n- reason: short explanation of why this route is appropriate\n- risk_flags: short list of risk patterns, such as \"multi_step\", \"not_except\", \"formal_logic\", \"protocol_edge_case\", \"calculation\", \"ambiguous_wording\", \"none\"\n\nDo not include markdown, prose outside JSON, or any extra keys.\n\nExamples of risk_flags:\n- \"multi_step\": multi-step calculation or iterative update\n- \"calculation\": non-trivial arithmetic or algorithmic computation\n- \"formal_logic\": tricky logical structure, double negatives, or \"not except\"\n- \"protocol_edge_case\": subtlety in protocol/architecture/distributed systems\n- \"ambiguous_wording\": unclear or tricky phrasing\n- \"none\": no special risk detected\n\nYour goal: Select \"mini\" only when \"nano\" is likely to fail but \"mini\" is likely to succeed, based on the above rules and patterns. Otherwise, select \"nano\". Avoid critical misroutes at all costs, especially for questions with subtle distinctions, negative logic, or security/malware/protocol definitions."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.07)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(-0.01)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(-0.07)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(-0.20)", fillcolor=lightgray, tooltip=" "];
    4 [label="4\\n(-0.20)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    0 -> 2;
    2 -> 3;
    2 -> 4;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
