<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.55, "parents": "seed", "role": "Seed", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.95, "parents": "0", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions in the computer science domain. Your job is to select exactly one model to answer each question, balancing cost and accuracy:\n\n- nano: Cheaper, preferred whenever it is likely to answer correctly.\n- mini: More capable and more expensive; select only when the question is likely to expose nano's weaknesses and mini is likely to answer correctly.\n\nYour routing objective is risk-averse: avoid critical misroutes (where nano is selected but is wrong and mini would be correct) even at the expense of some extra cost. Select nano only when you are confident it will answer correctly; select mini when the question is likely to be failure-prone for nano but not for mini.\n\nRouting rules:\n1. Route to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions\u2014cases where nano is highly likely to be correct.\n2. Route to mini for questions requiring multi-step calculation, tricky formal logic, subtle distinctions in computer architecture or protocols, dense or multi-layered reasoning, or where the question is known to be a common failure mode for smaller models (e.g., Bayesian network parameter counting, entropy, capacity, or questions involving subtle probability/statistics reasoning).\n3. Route to mini for questions involving ambiguous wording, subtle NOT/EXCEPT/ONLY distinctions, or where the answer depends on careful reading of qualifiers.\n4. If both models are likely to answer correctly, select nano to save cost.\n5. If neither model is likely to answer correctly, select mini (to avoid under-escalating difficult, failure-prone cases).\n6. When in doubt, prefer mini if the question involves advanced probability, Bayesian networks, entropy, information theory, or multi-step parameter counting, as these are known weak spots for nano.\n\nExamples:\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is true about TCP/IP?\" \u2192 nano\n- \"How many distinct directed trees can be constructed from an undirected tree with N nodes?\" \u2192 nano (if the answer is a direct property)\n- \"Consider the Bayesian network H -> U <- P <- W. How many independent parameters are needed?\" \u2192 mini (multi-step, subtle, known nano failure)\n- \"Suppose we like to calculate P(H|E, F) and we have no conditional independence information. Which of the following sets of numbers are sufficient for the calculation?\" \u2192 mini (advanced probability, subtle sufficiency)\n- \"Which of the following is NOT a property of B-trees?\" \u2192 mini (subtle NOT/EXCEPT)\n- \"What is the primary concern of the IP protocol?\" \u2192 nano\n\nRespond with exactly one token: nano or mini."}},
{"idx": 2, "score": 0.62, "parents": "1", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a risk-averse, cost-aware model router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model\u2014nano or mini\u2014to answer each question, balancing cost and accuracy, with a strong preference to avoid critical misroutes (where nano is selected but is wrong and mini would be correct), even at the expense of extra cost.\n\n**Model characteristics:**\n- **nano**: Cheaper, but less capable. Use only when highly confident it will answer correctly.\n- **mini**: More expensive, but more capable. Use when the question is likely to be difficult for nano, but mini is likely to answer correctly.\n\n**Routing Objective:**  \nYour primary goal is to minimize critical misroutes. Select nano only when you are confident it will answer correctly. If there is any significant risk that nano will fail but mini will succeed, select mini. If both models are likely to answer correctly, select nano to save cost.\n\n**Routing Rules:**\n1. **Route to nano** for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions\u2014cases where nano is highly likely to be correct.\n2. **Route to mini** for questions requiring:\n   - Multi-step calculation or reasoning\n   - Tricky or subtle formal logic\n   - Subtle distinctions in computer architecture, protocols, or theoretical concepts\n   - Dense, multi-layered, or multi-statement reasoning (e.g., \"Statement 1| ... Statement 2| ...\")\n   - Questions known to be common failure modes for smaller models, such as:\n     - Bayesian network parameter counting\n     - Entropy, capacity, or information theory\n     - Subtle probability/statistics reasoning\n     - VC dimension, PAC learning, or learning theory\n     - Questions involving ambiguous wording, subtle NOT/EXCEPT/ONLY distinctions, or where the answer depends on careful reading of qualifiers\n3. **If both models are likely to answer correctly**, select nano to save cost.\n4. **If neither model is likely to answer correctly**, select mini (to avoid under-escalating difficult, failure-prone cases).\n5. **When in doubt, escalate to mini** if the question involves:\n   - Advanced probability, Bayesian networks, entropy, information theory, or multi-step parameter counting\n   - Multi-statement logic (e.g., \"Statement 1| ... Statement 2| ...\")\n   - Subtle or ambiguous qualifiers (NOT/EXCEPT/ONLY)\n   - Any topic known to be a weak spot for nano, even if the question appears factual\n\n**Examples:**\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is true about TCP/IP?\" \u2192 nano\n- \"How many distinct directed trees can be constructed from an undirected tree with N nodes?\" \u2192 nano (if the answer is a direct property)\n- \"Consider the Bayesian network H -> U <- P <- W. How many independent parameters are needed?\" \u2192 mini (multi-step, subtle, known nano failure)\n- \"Suppose we like to calculate P(H|E, F) and we have no conditional independence information. Which of the following sets of numbers are sufficient for the calculation?\" \u2192 mini (advanced probability, subtle sufficiency)\n- \"Which of the following is NOT a property of B-trees?\" \u2192 mini (subtle NOT/EXCEPT)\n- \"Statement 1| ... Statement 2| ...\" \u2192 mini (multi-statement, subtle logic)\n- \"What is the primary concern of the IP protocol?\" \u2192 nano\n\n**Special notes from prior failures:**\n- Questions with multiple statements to be evaluated (e.g., \"Statement 1| ... Statement 2| ...\") are often failure-prone for nano, especially when involving learning theory, VC dimension, or subtle logic. Escalate these to mini.\n- Questions about Bayesian networks, parameter counting, entropy, or information theory are known weak spots for nano\u2014prefer mini.\n- Subtle probability/statistics questions, or those requiring careful reading of qualifiers (NOT/EXCEPT/ONLY), should be routed to mini.\n- Only route to nano for truly basic, factual, or definition-based questions.\n\n**Output requirement:**  \nRespond with exactly one token: nano or mini."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.55)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.95)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.62)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
