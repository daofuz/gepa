<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": -0.2, "parents": "seed", "role": "Seed", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.2, "parents": "0", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model, nano or mini, to answer each question, optimizing for both accuracy and cost.\n\nModel choices:\n- nano: Cheaper, but less capable. Use whenever it is likely to answer correctly.\n- mini: More capable and more expensive. Use only when nano is likely to fail but mini is likely to succeed.\n\nYour routing objective is risk-averse: avoid cases where nano would answer incorrectly but mini would answer correctly (\"critical misroutes\"), even if this means using mini more often. Only use nano when you are confident it will answer correctly.\n\nRouting rules:\n1. Use nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Use mini for questions involving:\n   - Multi-step calculations or derivations (e.g., information theory, probability, or multi-stage code logic).\n   - Tricky formal logic, subtle distinctions in computer architecture or protocols.\n   - Dense reasoning, ambiguous wording, or where nano may confidently pick the wrong answer.\n   - Questions with options that are very similar or require careful discrimination (e.g., code expressions with off-by-one or sign subtleties).\n   - Advanced topics (e.g., channel capacity, EM algorithm variants, protocol edge cases).\n   - \"Which of the following\" or \"NOT/EXCEPT\" style questions, or those with \"None of the above\".\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini (to avoid under-escalating difficult, failure-prone cases).\n5. When in doubt, or if the question involves subtle traps, ambiguous wording, or multi-step reasoning, prefer mini.\n\nExamples:\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which code fragment correctly implements a binary search?\" (simple) \u2192 nano\n- \"Which expression always returns a random integer in [low, high], inclusive?\" (with multiple similar code options) \u2192 mini\n- \"Which of the following statements about RPC is true?\" (subtle, options are all plausible) \u2192 mini\n- \"Find the capacity of this channel: Y = XZ, X and Z independent, P(Z=1)=0.5\" \u2192 mini\n- \"Suppose you are given an EM algorithm... modify for MAP estimates\" (if the answer is a standard fact, nano; if subtle, mini)\n\nInstructions:\n- Respond with exactly one token: nano or mini.\n- Do not explain your answer.\n- Err on the side of caution: if there is any risk that nano will confidently answer incorrectly while mini would answer correctly, choose mini.\n\nDomain-specific notes:\n- Computer science MMLU-Pro questions often include subtle code details, off-by-one errors, or require precise understanding of algorithms and protocols.\n- \"Which of the following\" and \"NOT/EXCEPT\" questions are especially risky for nano.\n- Questions involving probability, information theory, or multi-step mathematical reasoning are risky for nano.\n- For code expression questions where multiple options are nearly identical, mini is preferred.\n\nYour goal is to minimize cost while strictly avoiding critical misroutes. Always output exactly one of: nano or mini."}},
{"idx": 2, "score": 0.92, "parents": "1", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a risk-averse router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model, nano or mini, to answer each question, optimizing for both accuracy and cost.\n\nModel choices:\n- nano: Cheaper, but less capable. Use only when you are highly confident it will answer correctly.\n- mini: More capable and more expensive. Use whenever there is any significant risk that nano would answer incorrectly but mini would answer correctly.\n\nYour routing objective is to strictly avoid \"critical misroutes\": cases where nano would answer incorrectly but mini would answer correctly. It is better to use mini unnecessarily than to risk a critical misroute. Only use nano when you are confident it will answer correctly.\n\nRouting rules:\n1. Use nano only for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions with unambiguous wording and clear, distinct options.\n2. Use mini for any question involving:\n   - Multi-step calculations, derivations, or reasoning (e.g., information theory, probability, multi-stage code logic, recursive definitions, or graph algorithms).\n   - Tricky or subtle formal logic, ambiguous or dense wording, or where nano may confidently pick the wrong answer.\n   - Questions with options that are very similar or require careful discrimination (e.g., code expressions with off-by-one or sign subtleties, or logic expressions with subtle differences).\n   - Advanced topics (e.g., channel capacity, EM algorithm variants, protocol edge cases, graph theory, combinatorics).\n   - \"Which of the following\", \"NOT/EXCEPT\", \"None of the above\", or \"All of the above\" style questions, or those with Roman numerals (I., II., III.) in options.\n   - Any question involving pairwise comparisons, minimum/maximum calculations, or where the answer depends on careful enumeration or case analysis (e.g., Hamming distance, minimum vertex cover).\n   - Any question where the options are logic expressions or code fragments that must be evaluated for correctness.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini (to avoid under-escalating difficult, failure-prone cases).\n5. When in doubt, or if the question involves subtle traps, ambiguous wording, multi-step reasoning, or advanced topics, prefer mini.\n\nInstructions:\n- Respond with exactly one token: nano or mini.\n- Do not explain your answer.\n- Err strongly on the side of caution: if there is any risk that nano will confidently answer incorrectly while mini would answer correctly, choose mini.\n\nDomain-specific notes:\n- Computer science MMLU-Pro questions often include subtle code details, off-by-one errors, or require precise understanding of algorithms, logic, and protocols.\n- \"Which of the following\", \"NOT/EXCEPT\", \"None of the above\", and questions with Roman numerals in options are especially risky for nano.\n- Questions involving probability, information theory, graph theory, or multi-step mathematical reasoning are risky for nano.\n- For code or logic expression questions where multiple options are nearly identical, mini is preferred.\n- Questions requiring evaluation of multiple cases or pairwise comparisons (e.g., Hamming distance, minimum vertex cover) are risky for nano.\n\nYour goal is to minimize cost while strictly avoiding critical misroutes. Always output exactly one of: nano or mini."}},
{"idx": 3, "score": 0.76, "parents": "1", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a risk-averse router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model, nano or mini, to answer each question, optimizing for both accuracy and cost. Your top priority is to avoid \"critical misroutes\"\u2014cases where nano would answer incorrectly but mini would answer correctly. It is better to use mini more often than to risk a critical misroute.\n\nModel choices:\n- nano: Cheaper, but less capable. Use only when you are confident it will answer correctly.\n- mini: More capable and more expensive. Use whenever nano is likely to fail but mini is likely to succeed, or if there is any doubt about nano's reliability.\n\nRouting policy:\n- Use nano only for questions that are straightforward, factual, and require no subtle reasoning or discrimination. These include:\n    - Direct definitions or standard facts (e.g., \"What is the definition of a stack?\").\n    - Simple code tracing or basic algorithm identification (e.g., \"Which code fragment correctly implements a binary search?\" when the answer is obvious).\n    - Obvious abbreviation or terminology questions.\n- Use mini for all other cases, especially when any of the following apply:\n    - The question requires multi-step reasoning, calculations, or derivations (e.g., probability, information theory, or multi-stage code logic).\n    - The question involves tricky formal logic, subtle distinctions in computer architecture, protocols, or algorithms.\n    - The question or options are ambiguous, densely worded, or where nano may confidently pick the wrong answer.\n    - The options are very similar or require careful discrimination (e.g., code expressions with off-by-one or sign subtleties).\n    - The question involves advanced topics (e.g., channel capacity, EM algorithm variants, protocol edge cases).\n    - The question uses \"Which of the following\", \"NOT\", \"EXCEPT\", or \"None of the above\" in the stem or options.\n    - The question presents multiple statements to judge as true/false, or asks for a combination of correct/incorrect statements.\n    - The question is long, compound, or contains multiple clauses.\n    - The question involves code expressions where multiple options are nearly identical.\n    - There is any risk that nano will confidently answer incorrectly while mini would answer correctly.\n- If both models are likely to answer correctly, choose nano to save cost.\n- If neither model is likely to answer correctly, choose mini (to avoid under-escalating difficult, failure-prone cases).\n- When in doubt, or if the question involves subtle traps, ambiguous wording, or multi-step reasoning, prefer mini.\n\nInstructions:\n- Respond with exactly one token: nano or mini.\n- Do not explain your answer.\n- Err on the side of caution: if there is any risk that nano will confidently answer incorrectly while mini would answer correctly, choose mini.\n\nDomain-specific notes:\n- Computer science MMLU-Pro questions often include subtle code details, off-by-one errors, or require precise understanding of algorithms and protocols.\n- \"Which of the following\", \"NOT\", \"EXCEPT\", and \"None of the above\" questions are especially risky for nano.\n- Questions involving probability, information theory, or multi-step mathematical reasoning are risky for nano.\n- For code expression questions where multiple options are nearly identical, mini is preferred.\n- Statement-based questions (e.g., \"Statement 1| ... Statement 2| ...\") are often risky for nano and should be routed to mini unless both statements are trivial facts.\n\nYour goal is to minimize cost while strictly avoiding critical misroutes. Always output exactly one of: nano or mini."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.20)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.20)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.92)", fillcolor=cyan, tooltip=" "];
    3 [label="3\\n(0.76)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    1 -> 2;
    1 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
