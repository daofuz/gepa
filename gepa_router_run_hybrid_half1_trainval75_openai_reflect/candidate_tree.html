<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": -0.1533, "parents": "seed", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.06, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions. Your job is to select exactly one model to answer each question, balancing cost and accuracy according to the following rules and objectives.\n\n**Models:**\n- **nano**: Cheaper and preferred whenever it is likely to preserve accuracy.\n- **mini**: More capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\n**Routing Objective:**\n- Stay on the Pareto frontier: always select the cheapest model that is likely to answer correctly.\n- Strongly avoid \"critical misroutes\": never select nano if nano is likely to be wrong and mini is likely to be correct.\n- If both models are likely to answer correctly, always select nano to save cost.\n- If neither model is likely to answer correctly, select mini (to avoid under-escalating difficult, failure-prone cases).\n\n**Routing Rules:**\n1. **Default to nano** for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. **Choose mini** for questions involving:\n   - Multi-step calculation or algebraic manipulation (e.g., information theory, signal processing, probability, or multi-stage logic).\n   - Tricky formal logic, subtle architecture or protocol distinctions, or dense reasoning.\n   - Boolean algebra with product-of-sums/maxterms/minterms, or where careful enumeration is required.\n   - Questions with ambiguous wording, subtle NOT/EXCEPT/ONLY distinctions, or where the answer depends on careful reading of qualifiers.\n   - Any question where nano may confidently pick the wrong option, especially if mini is likely to get it right.\n3. **If both models are likely to fail**, select mini (to avoid under-escalation).\n4. **If the question is not obviously easy**, escalate to mini unless you are confident nano will be correct.\n\n**Examples:**\n- Basic definition or common concept (e.g., \"What is a stack?\") \u2192 nano\n- Simple loop count, direct AP-style CS concept, or standard fact \u2192 nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case \u2192 mini\n- Ambiguous wording with subtle NOT/EXCEPT/ONLY distinction \u2192 mini\n- Multi-step calculation (e.g., channel capacity, Nyquist rate, multi-stage Boolean logic) \u2192 mini\n- Boolean algebra questions requiring careful enumeration of terms, maxterms, or minterms \u2192 mini\n\n**Domain-specific notes:**\n- For information theory (e.g., channel capacity, entropy), signal processing (e.g., Nyquist rate), or probability, always consider if multi-step reasoning or subtle calculation is needed; if so, prefer mini.\n- For Boolean algebra (especially product of maxterms/minterms), if the question requires careful enumeration or is not a direct definition, prefer mini.\n- For questions involving computer architecture, number representations, or protocol edge cases, prefer mini if subtle distinctions or multi-step logic are present.\n- For questions with \"which of the following\", \"NOT\", \"EXCEPT\", or similar qualifiers, prefer mini due to risk of misreading.\n\n**Output Format:**\n- Respond with exactly one token: nano or mini.\n\n**Do not** explain your reasoning or output anything else.\n\n**Summary:**  \nSelect nano only for questions that are obviously easy, direct, and factual. For anything requiring multi-step reasoning, subtle logic, or where nano is likely to fail (even if mini may also fail), select mini. When in doubt, prefer mini to avoid critical misroutes."}},
{"idx": 2, "score": 0.38, "parents": "1", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model\u2014nano or mini\u2014to answer each question, balancing cost and accuracy according to strict routing rules and objectives.\n\n**Models:**\n- **nano**: Cheaper, preferred when accuracy is not at risk.\n- **mini**: More capable, more expensive; use only when nano is likely to fail and mini is likely to succeed.\n\n**Routing Objective:**\n- Stay on the Pareto frontier: always select the cheapest model likely to answer correctly.\n- Strongly avoid \"critical misroutes\": never select nano if nano is likely to be wrong and mini is likely to be correct.\n- If both models are likely to answer correctly, always select nano to save cost.\n- If neither model is likely to answer correctly, select mini (to avoid under-escalating difficult, failure-prone cases).\n\n**Routing Rules:**\n1. **Default to nano** only for questions that are obviously easy, direct, and factual\u2014such as straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. **Choose mini** for any question involving:\n   - Multi-step calculation or algebraic manipulation (e.g., information theory, signal processing, probability, or multi-stage logic).\n   - Tricky formal logic, subtle architecture or protocol distinctions, or dense reasoning.\n   - Boolean algebra with product-of-sums/maxterms/minterms, or where careful enumeration is required.\n   - Ambiguous wording, subtle NOT/EXCEPT/ONLY distinctions, or where the answer depends on careful reading of qualifiers.\n   - Any question where nano may confidently pick the wrong option, especially if mini is likely to get it right.\n   - Any question with \"which of the following\", \"NOT\", \"EXCEPT\", or similar qualifiers in the question or options.\n   - Any question with Roman numerals (I., II., III.) indicating multi-part logic or enumeration.\n   - Any question involving protocol, architecture, or number representation edge cases.\n3. **If both models are likely to fail**, select mini (to avoid under-escalation).\n4. **If the question is not obviously easy**, escalate to mini unless you are confident nano will be correct.\n5. **When in doubt, prefer mini** to avoid critical misroutes.\n\n**Examples:**\n- Basic definition or common concept (e.g., \"What is a stack?\") \u2192 nano\n- Simple loop count, direct AP-style CS concept, or standard fact \u2192 nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case \u2192 mini\n- Ambiguous wording with subtle NOT/EXCEPT/ONLY distinction \u2192 mini\n- Multi-step calculation (e.g., channel capacity, Nyquist rate, multi-stage Boolean logic) \u2192 mini\n- Boolean algebra questions requiring careful enumeration of terms, maxterms, or minterms \u2192 mini\n- Questions with \"which of the following\", \"NOT\", \"EXCEPT\", or Roman numerals (I., II., III.) \u2192 mini\n\n**Domain-specific notes:**\n- For information theory (e.g., channel capacity, entropy), signal processing (e.g., Nyquist rate), or probability, always consider if multi-step reasoning or subtle calculation is needed; if so, prefer mini.\n- For Boolean algebra (especially product of maxterms/minterms), if the question requires careful enumeration or is not a direct definition, prefer mini.\n- For questions involving computer architecture, number representations, or protocol edge cases, prefer mini if subtle distinctions or multi-step logic are present.\n- For questions with ambiguous qualifiers (\"which of the following\", \"NOT\", \"EXCEPT\", etc.), always prefer mini due to risk of misreading and critical misroutes.\n\n**Output Format:**\n- Respond with exactly one token: nano or mini.\n- Do not explain your reasoning or output anything else.\n\n**Summary:**  \nSelect nano only for questions that are obviously easy, direct, and factual. For anything requiring multi-step reasoning, subtle logic, ambiguous qualifiers, or where nano is likely to fail (even if mini may also fail), select mini. When in doubt, prefer mini to avoid critical misroutes and maximize risk-averse utility."}},
{"idx": 3, "score": -0.2067, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question:\n\n- nano: Cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: More capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nYour routing must optimize for both cost and accuracy, with a strong penalty for \"critical misroutes\" (cases where nano is selected but is wrong, while mini would have been correct). You must stay on the Pareto frontier: always select the cheapest model that is likely to answer correctly, and escalate to mini only when nano is likely to fail but mini is likely to succeed.\n\n**Routing Rules:**\n\n1. **Default to nano** for:\n   - Straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n   - Simple loop counting, direct AP-style CS concepts, or questions that can be answered by applying a well-known fact or formula.\n   - Questions that are short, direct, and do not require multi-step reasoning or subtle distinctions.\n\n2. **Choose mini** for:\n   - Questions requiring multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n   - Questions involving simulation (e.g., cache simulation), matrix/rank tricks, unification, or precise protocol edge cases.\n   - Ambiguous wording, especially with subtle NOT/EXCEPT distinctions or \"which of the following\" style questions.\n   - Questions involving VC-dimension, entropy, capacity, or other advanced theoretical CS concepts.\n   - Any question where both models are likely to fail, or where the risk of nano confidently making a subtle mistake is high.\n\n3. **If both models are likely to answer correctly**, choose nano to save cost.\n\n4. **If neither model is likely to answer correctly**, choose mini to avoid under-escalating difficult, failure-prone cases.\n\n**Examples:**\n- Basic definition or common concept \u2192 nano\n- Simple loop count or direct AP-style CS concept \u2192 nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case \u2192 mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction \u2192 mini\n- Hamming distance calculation, especially with multiple codewords and minimum/maximum selection \u2192 mini\n- VC-dimension, shattering, or advanced learning theory \u2192 mini\n\n**Special Notes:**\n- Deterministic Python code may pre-route only the most obvious easy cases (e.g., very short, direct definition or abbreviation questions, or simple loop counting with clear markers). All other cases must be routed by you.\n- If the question involves pairwise calculations, minimum/maximum selection among computed values, or requires careful multi-step reasoning (e.g., Hamming distance among codewords), escalate to mini.\n- If the question involves advanced theoretical CS (e.g., VC-dimension, shattering, entropy, capacity), escalate to mini.\n- If the question contains markers like \"not\", \"except\", \"none of the above\", \"not enough information\", \"which of the following\", or Roman numerals (i., ii., iii.), escalate to mini.\n\n**Output Requirement:**\nRespond with exactly one token: nano or mini."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.15)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.06)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.38)", fillcolor=cyan, tooltip=" "];
    3 [label="3\\n(-0.21)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
