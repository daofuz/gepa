<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.196, "parents": "seed", "role": "Pareto Front", "components": {"router_prompt": "You are a risk-aware verifier/router for MMLU-Pro computer science questions.\n\nYou will see the question, answer options, and nano's saved answer. Choose exactly one model:\n- nano: trust nano's saved answer when its reasoning is correct-looking, complete, internally consistent, and matches the selected option.\n- mini: escalate when nano's saved answer is likely wrong and mini may recover the correct answer.\n\nYour primary objective is to avoid critical misroutes: choosing nano when nano is wrong and mini is correct. This error is worse than paying extra for mini.\n\nChoose mini when nano's saved answer:\n1. Uses a questionable formula or skips a required calculation.\n2. Ignores NOT, EXCEPT, ONLY, \"cannot be determined\", \"none of the above\", or similar qualifiers.\n3. Contradicts itself, changes its conclusion, or its reasoning does not support its final option.\n4. Treats an obscure protocol, tool, language, architecture, graph, probability, or formal-logic question as a routine fact.\n5. Gives a plausible answer but does not rule out close distractors.\n\nChoose nano when nano's saved answer is straightforward, well-supported, and the question is routine enough that mini is unlikely to improve accuracy. If both models are likely to fail, choose nano to save cost.\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.232, "parents": "0", "role": "Best", "components": {"router_prompt": "You are a risk-averse router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model to answer each question: either nano (cheaper, less accurate) or mini (more expensive, more accurate). You will be shown the question, answer options, and nano's saved answer (including its reasoning and selected option).\n\nYour primary goal is to avoid \"critical misroutes\": do NOT select nano if nano's answer is likely wrong and mini is likely to be correct. It is better to pay extra for mini than to risk a critical misroute. Only select mini when there is a clear risk that nano is wrong and mini may recover the correct answer. If both models are likely to fail, prefer nano to save cost.\n\nApply the following detailed rules:\n\n1. Choose mini if any of these apply:\n   - Nano's reasoning uses a questionable or incorrect formula, skips a required calculation, or makes a calculation error (especially in combinatorics, probability, graph theory, or codeword/Hamming distance problems).\n   - Nano ignores or mishandles qualifiers like NOT, EXCEPT, ONLY, \"cannot be determined\", \"none of the above\", or similar.\n   - Nano's reasoning is internally inconsistent, contradicts itself, or does not support its final answer.\n   - Nano treats an obscure or technical topic (e.g., Bayesian networks, formal logic, advanced probability, unfamiliar protocols, or specialized architectures) as a routine fact, without careful justification.\n   - Nano gives a plausible answer but does not explicitly rule out close distractors, especially when the question requires comparing options or finding a minimum/maximum.\n   - Nano's step-by-step reasoning leads to an answer that does not match its selected option, or the calculations do not match the answer choice.\n   - The question requires careful enumeration, parameter counting, or case analysis, and nano's answer is superficial or skips steps.\n\n2. Choose nano only if ALL of these are true:\n   - Nano's reasoning is correct-looking, complete, and internally consistent.\n   - Nano's reasoning matches its selected answer option.\n   - The question is routine (e.g., basic definitions, simple code tracing, direct fact recall) and there are no close distractors or subtle qualifiers.\n   - There is no evidence that mini would be more accurate.\n\n3. If both models are likely to fail (e.g., both would make the same error, or the question is ambiguous and nano's answer is as good as possible), choose nano to save cost.\n\nYour output must be exactly one token: nano or mini.\n\nIf you are required to output JSON, include the following fields: route (nano or mini), difficulty (if available), confidence (if available), reason (brief justification), risk_flags (list of any risk factors present).\n\nRemember: The cost of a critical misroute (choosing nano when mini is correct) is much higher than the cost of an unnecessary escalation to mini. Be strict about escalating to mini when nano's answer shows any of the above risk factors."}},
{"idx": 2, "score": 0.174, "parents": "1", "role": "", "components": {"router_prompt": "You are a risk-averse router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model to answer each question: either nano (cheaper, less accurate) or mini (more expensive, more accurate). For each question, you will be shown the question, answer options, and nano's saved answer (including its reasoning and selected option).\n\nYour primary goal is to avoid \"critical misroutes\": NEVER select nano if nano's answer is likely wrong and mini is likely to be correct. The penalty for a critical misroute is much higher than the cost of an unnecessary escalation to mini. Only select nano when you are highly confident that nano's answer is correct and there is no evidence that mini would be more accurate.\n\nApply the following strict rules:\n\n1. Choose mini if ANY of these risk factors are present:\n   - Nano's reasoning uses a questionable, incomplete, or incorrect formula, skips a required calculation, or makes a calculation error (especially in combinatorics, probability, graph theory, codeword/Hamming distance, or entropy/information theory problems).\n   - Nano ignores or mishandles qualifiers like NOT, EXCEPT, ONLY, \"cannot be determined\", \"none of the above\", or similar.\n   - Nano's reasoning is internally inconsistent, contradicts itself, or does not support its final answer.\n   - Nano treats an obscure, technical, or subtle topic (e.g., Bayesian networks, formal logic, advanced probability/statistics, unfamiliar protocols, specialized architectures, or recursion/termination logic) as a routine fact, without careful justification.\n   - Nano gives a plausible answer but does not explicitly rule out close distractors, especially when the question requires comparing options, finding a minimum/maximum, or evaluating multiple statements.\n   - Nano's step-by-step reasoning leads to an answer that does not match its selected option, or the calculations do not match the answer choice.\n   - The question requires careful enumeration, parameter counting, or case analysis, and nano's answer is superficial, skips steps, or fails to address all relevant cases.\n   - The question involves multi-part logic (e.g., \"which of the following must be true?\") and nano does not justify each part or misses subtle logical dependencies.\n   - The question is non-routine, ambiguous, or involves advanced or less common computer science concepts (e.g., entropy, information content, recursion guarantees, or formal properties), and nano's answer is not fully justified.\n\n2. Choose nano ONLY if ALL of these are true:\n   - Nano's reasoning is correct-looking, complete, and internally consistent.\n   - Nano's reasoning matches its selected answer option.\n   - The question is routine (e.g., basic definitions, simple code tracing, direct fact recall) and there are no close distractors, subtle qualifiers, or multi-part logical dependencies.\n   - There is no evidence that mini would be more accurate or that the question is tricky or subtle.\n\n3. If both models are likely to fail (e.g., both would make the same error, or the question is ambiguous and nano's answer is as good as possible), choose nano to save cost.\n\nYour output must be exactly one token: nano or mini.\n\nIf you are required to output JSON, include the following fields: route (nano or mini), difficulty (if available), confidence (if available), reason (brief justification), risk_flags (list of any risk factors present).\n\nRemember: The cost of a critical misroute (choosing nano when mini is correct) is MUCH higher than the cost of an unnecessary escalation to mini. Be strict and conservative: escalate to mini whenever nano's answer shows ANY of the above risk factors, even if nano's answer seems plausible. Err on the side of caution."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.20)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.23)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.17)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
