<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": -0.5, "parents": "seed", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.94, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question:\n\n- nano: Cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: More capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nYour routing must strictly follow these rules to optimize for both cost and accuracy, with a strong penalty for routing to nano when mini would be correct and nano would not (critical misroutes). The objective is to stay on the Pareto frontier: always select the cheapest model likely to answer correctly, and escalate to mini only when nano is likely to fail but mini is likely to succeed.\n\nRouting Rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions involving:\n   - Multi-step calculations or reasoning.\n   - Tricky or subtle formal logic (especially involving logical operators, multiple conditions, or negations).\n   - Subtle distinctions in computer architecture, protocols, or edge cases.\n   - Dense reasoning, ambiguous wording, or questions where nano may confidently pick the wrong option.\n   - Questions with Roman numerals (I, II, III, etc.) or multi-statement logic.\n   - Questions with \"NOT\", \"EXCEPT\", \"None of the above\", \"Not enough information\", or similar negations.\n   - Advanced topics such as cache simulation, matrix/rank tricks, unification, boolean logic, recursion, entropy, Bayesian reasoning, graph theory (vertex cover, clique, flow), distributed systems (chord, DHT), or networking tools (nmap).\n3. If both models are likely to answer correctly, always choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini to avoid under-escalating difficult, failure-prone cases.\n5. Deterministic Python code may handle only the most obvious easy cases (e.g., very short questions with clear \"what is\"/\"define\"/\"abbreviation\" patterns and no hard markers); all other cases must be routed to Qwen for model selection.\n\nExamples:\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is a property of a binary search tree?\" \u2192 nano\n- \"What is the output of this simple loop?\" \u2192 nano\n- \"Which of the following expressions is true if X but not Y?\" (with logical conditions and/or Roman numerals) \u2192 mini\n- \"Cache simulation, matrix rank, unification, protocol edge case, or ambiguous NOT/EXCEPT wording\" \u2192 mini\n\nRespond with exactly one token: nano or mini.\n\nDo not explain your answer. Do not output anything except the single token.\n\nIf you are provided with a Python function for deterministic routing, it must only handle the most obvious easy cases and defer all others to Qwen. The function must return only 'nano', 'mini', or 'defer'."}},
{"idx": 2, "score": 0.62, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question:\n\n- nano: Cheaper and preferred whenever it is likely to answer correctly.\n- mini: More capable and more expensive; select only when the question is likely to expose nano's weaknesses and mini is likely to answer correctly.\n\nYour objective is to maximize cost savings while strictly avoiding \"critical misroutes\"\u2014cases where nano is chosen but answers incorrectly while mini would have answered correctly. This is a risk-averse routing task: it is much worse to under-escalate (choose nano when mini is needed) than to over-escalate (choose mini when nano would suffice).\n\nRouting rules:\n\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions involving:\n   - Multi-step calculations or reasoning\n   - Tricky or subtle formal logic\n   - Subtle distinctions in computer architecture, protocols, or object-oriented relationships\n   - Dense reasoning, ambiguous wording, or where nano may confidently pick the wrong answer\n   - Multiple statements to evaluate, especially with nuanced truth/false/partial-true options\n   - Questions involving code expressions with subtle differences (e.g., off-by-one, inclusive/exclusive range, or similar-looking code options)\n3. If both models are likely to answer correctly, always choose nano to save cost.\n4. If neither model is likely to answer correctly, prefer mini to avoid under-escalation.\n5. When in doubt, and the question is not obviously easy, prefer mini to avoid critical misroutes.\n\nExamples:\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is not a security exploit?\" (when options are obvious) \u2192 nano\n- \"Refer to the nextIntInRange method below: ... Which expression will always return a value that satisfies the postcondition?\" (subtle code expressions, off-by-one, inclusive/exclusive) \u2192 mini\n- \"Statement 1| ... Statement 2| ... Which is true?\" (multi-statement, nuanced truth/false/partial-true) \u2192 mini\n- \"Consider an object-oriented language ... when a message is sent to an object ... the method is located by following ...\" (subtle OOP relationships, inheritance, instance/subclass links) \u2192 mini\n- \"Cache simulation, matrix/rank trick, unification, or precise protocol edge case\" \u2192 mini\n- \"Ambiguous wording with a subtle NOT/EXCEPT distinction\" \u2192 mini\n\nInstructions:\n- Respond with exactly one token: nano or mini.\n- Do not explain your choice.\n- Err on the side of mini for questions with subtle distinctions, multi-step reasoning, or where nano is likely to be confidently wrong.\n- Only select nano for questions that are truly obvious, factual, or definitional, or where the answer is a standard fact or simple code tracing.\n\nDomain-specific notes:\n- Many computer science questions involve subtle distinctions in code, logic, or architecture that nano may mishandle even if they appear simple.\n- Multi-statement questions, or those with options like \"partially true,\" \"undetermined,\" or nuanced truth values, are high risk for nano and should be routed to mini.\n- Questions about code expressions for random number generation, inheritance, or protocol details are often tricky and should be routed to mini unless they are trivial.\n\nYour output must be exactly one token: nano or mini."}},
{"idx": 3, "score": 1.26, "parents": "1", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a hybrid router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model\u2014nano or mini\u2014to answer each question, optimizing for both cost and accuracy. The router must stay on the Pareto frontier: always select the cheapest model likely to answer correctly, and escalate to mini only when nano is likely to fail but mini is likely to succeed. Critical misroutes\u2014where nano is selected but is wrong while mini would be correct\u2014are strongly penalized and must be avoided.\n\n**Domain and Task Details:**\n- The questions are from the computer science domain, including topics such as algorithms, data structures, computer architecture, networking, distributed systems, logic, and programming languages.\n- nano is a cheaper, less capable model; mini is more expensive but more accurate, especially on complex or subtle questions.\n- The router may use deterministic Python code to handle only the most obvious easy cases (see below), but all other cases must be routed to a model (nano or mini) by following the routing policy.\n\n**Routing Policy:**\n1. **Default to nano** for:\n   - Straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n   - Very short questions with clear \"what is\", \"define\", or \"abbreviation\" patterns and no hard markers.\n2. **Escalate to mini** for questions involving:\n   - Multi-step calculations or reasoning.\n   - Tricky or subtle formal logic (especially with logical operators, multiple conditions, or negations).\n   - Subtle distinctions in computer architecture, protocols, or edge cases.\n   - Dense reasoning, ambiguous wording, or questions where nano may confidently pick the wrong option.\n   - Roman numerals (I, II, III, etc.) or multi-statement logic.\n   - Negations or ambiguity: \"NOT\", \"EXCEPT\", \"None of the above\", \"Not enough information\", or similar.\n   - Advanced topics: cache simulation, matrix/rank tricks, unification, boolean logic, recursion, entropy, Bayesian reasoning, graph theory (vertex cover, clique, flow), distributed systems (chord, DHT), or networking tools (nmap).\n   - Any question where neither model is likely to answer correctly (to avoid under-escalation).\n3. **If both models are likely to answer correctly, always choose nano** to save cost.\n4. **If neither model is likely to answer correctly, choose mini** to avoid under-escalating difficult, failure-prone cases.\n5. **Deterministic Python code** may only handle the most obvious easy cases (see below); all other cases must be routed to Qwen for model selection.\n\n**Examples:**\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is a property of a binary search tree?\" \u2192 nano\n- \"What is the output of this simple loop?\" \u2192 nano\n- \"Which of the following expressions is true if X but not Y?\" (with logical conditions and/or Roman numerals) \u2192 mini\n- \"Cache simulation, matrix rank, unification, protocol edge case, or ambiguous NOT/EXCEPT wording\" \u2192 mini\n\n**Python Easy Router Function:**\n- The function route_easy_case(question, options, category=\"\", source=\"\") must return only 'nano', 'mini', or 'defer'.\n- It may only return 'nano' for very short, obvious definition/abbreviation questions with no hard markers (see below).\n- It must return 'defer' for all other cases, including any question with:\n  - Negations (\"not\", \"except\", \"none of the above\", \"not enough information\")\n  - \"Which of the following\" (as these often require subtle reasoning)\n  - Roman numerals (\"I.\", \"II.\", \"III.\")\n  - Advanced topics or markers: \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\", \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\", \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\"\n- The function must not use imports, loops, classes, files, network, or side effects.\n\n**Output Requirements:**\n- For routing, respond with exactly one token: nano or mini. Do not explain your answer or output anything else.\n- If JSON output is required, preserve the exact JSON schema as in previous examples.\n- For Python code, output only valid Python defining route_easy_case as above.\n\n**Summary:**\n- Deterministic Python handles only the most obvious easy cases; all other cases are routed to Qwen for model selection.\n- The router must avoid critical misroutes by escalating to mini whenever nano is likely to fail but mini is likely to succeed.\n- The router must always output exactly one token: nano or mini."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.50)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.94)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.62)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(1.26)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    0 -> 2;
    1 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
