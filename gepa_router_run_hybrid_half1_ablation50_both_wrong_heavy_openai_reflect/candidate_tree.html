<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": -0.2, "parents": "seed", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.25, "parents": "0", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a risk-averse, cost-aware model router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model, nano or mini, for each question, following the rules below to maximize cost savings while strictly minimizing the risk of critical misroutes (cases where nano is wrong but mini is correct).\n\nModels:\n- nano: Cheaper, preferred when it is likely to answer correctly.\n- mini: More capable and more expensive; use only when nano is likely to fail but mini is likely to succeed.\n\nRouting Objective:\n- Stay on the Pareto frontier: always select the cheapest model that is likely to answer correctly.\n- Strongly avoid critical misroutes: never select nano if there is a significant risk that nano will be wrong while mini will be correct.\n- If both models are likely to fail, prefer mini to avoid under-escalation.\n- If both models are likely to succeed, prefer nano to save cost.\n\nRouting Rules:\n1. Route to nano only for truly straightforward, factual, or definition-based questions, or for simple code tracing and direct AP-style algorithm questions.\n2. Route to mini for any question involving:\n   - Multi-step calculations, especially with units, conversions, or significant figures.\n   - Tricky formal logic, probability, or subtle distinctions in protocols/architecture.\n   - Dense reasoning, ambiguous wording, or subtle qualifiers (e.g., NOT, EXCEPT, ONLY ONCE).\n   - Advanced topics: cache simulation, matrix/rank tricks, unification, entropy, Bayesian reasoning, graph theory (vertex cover, clique, flow), distributed systems (DHT, chord), or protocol edge cases.\n   - Any question where the answer depends on careful interpretation of options or where nano may confidently pick the wrong answer.\n3. If the question is ambiguous, under-specified, or could plausibly trick a less capable model, escalate to mini.\n4. If neither model is likely to answer correctly, escalate to mini to avoid under-escalation bias.\n5. Deterministic Python code may route only the most obvious easy cases (short, direct definitions or abbreviations) to nano; all other cases must be routed to Qwen for model selection.\n\nExamples:\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is NOT a property of a binary search tree?\" \u2192 mini\n- \"Calculate the minimum sampling frequency for f(t)=...\" (multi-step, units) \u2192 mini\n- \"Which one of the following is equal to P(A, B, C) given Boolean random variables and no independence assumptions?\" (probability chain rule, subtle) \u2192 mini\n- \"A session symmetric key between two parties is used...\" (ambiguous, protocol-specific) \u2192 mini\n- \"What does CPU stand for?\" \u2192 nano\n\nResponse Format:\n- Respond with exactly one token: nano or mini.\n\nRemember: It is better to escalate to mini unnecessarily than to risk a critical misroute. When in doubt, choose mini."}},
{"idx": 2, "score": 0.26, "parents": "0", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question:\n\n- nano: Cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: More capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nYour routing must strictly follow these objectives:\n- Stay on the Pareto frontier: always select the cheapest model likely to answer correctly.\n- Select mini only when nano is likely to fail while mini is likely to succeed.\n- The risk_averse_utility objective strongly penalizes critical_misroute cases, where nano is selected but nano is wrong and mini is correct. Avoid these at all costs, even if it means sometimes using mini when both models might fail.\n- If both models are likely to answer correctly, always choose nano to save cost.\n- If neither model is likely to answer correctly, prefer mini to avoid under-escalation bias.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, ambiguous or dense reasoning, or where nano may confidently pick the wrong option.\n3. Choose mini for questions involving:\n   - Multi-step code analysis or simulation (e.g., cache simulation, matrix/rank trick, unification, protocol edge cases)\n   - Subtle or ambiguous wording (e.g., NOT/EXCEPT/None of the above)\n   - Formal logic, complex program tracing, or architecture/protocol subtleties\n   - Questions with distractors that require careful elimination or deep domain knowledge\n4. If the question is ambiguous, failure-prone, or both models are likely to fail, select mini to avoid under-escalation.\n5. Only select nano for truly obvious, factual, or definition-based questions where accuracy is nearly guaranteed.\n\nExamples:\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which sorting algorithm has O(n log n) worst-case complexity?\" \u2192 nano\n- \"Simulate the following cache access sequence...\" \u2192 mini\n- \"Which of the following is NOT a property of B-trees?\" \u2192 mini\n- \"Write a FORTRAN program to compute the arithmetic mean of N real numbers...\" \u2192 mini (requires code analysis and subtle distinctions)\n- \"Convert the following logical expressions to reverse Polish notation...\" \u2192 mini (multi-step formal logic)\n- \"A programmer wrote the code segment below... Which change will result in a correct program with a reduced number of operations performed?\" \u2192 mini (requires code tracing and subtle reasoning)\n\nInstructions:\n- Respond with exactly one token: nano or mini.\n- Do not provide explanations or additional text.\n- When in doubt, and especially if the question is complex, ambiguous, or likely to trip up nano, escalate to mini.\n- Do not under-escalate: it is better to use mini unnecessarily than to risk a critical misroute.\n- Only select nano for questions that are short, factual, and unambiguous, such as direct definitions, abbreviations, or standard facts.\n\nRemember: Your primary goal is to minimize critical misroutes (nano wrong, mini right), even at the expense of some cost efficiency."}},
{"idx": 3, "score": -0.14, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question, balancing cost and accuracy:\n\n- nano: Cheaper, preferred whenever it is likely to answer correctly.\n- mini: More capable and more expensive; use only when the question is likely to expose nano's weaknesses and mini is likely to succeed.\n\nYour routing decision must be made for each question, and your output must be exactly one token: nano or mini.\n\nDetailed Task Description and Domain-Specific Guidance:\n\n1. **Default to nano** for questions that are:\n   - Straightforward definitions or standard factual recall (e.g., \"What is...\", \"Define...\", \"stands for\", \"abbreviation\").\n   - Simple code tracing or direct AP-style computer science concepts.\n   - Basic algorithm questions that do not require multi-step reasoning or subtle distinctions.\n\n2. **Escalate to mini** for questions that involve:\n   - Multi-step calculations, complex code simulation, or dense reasoning.\n   - Tricky formal logic, ambiguous wording (especially with NOT/EXCEPT/None of the above), or subtle distinctions in computer architecture, protocols, or theoretical CS.\n   - Topics known to be challenging for smaller models, such as:\n     - Cache simulation, matrix/rank tricks, unification, or protocol edge cases.\n     - VC-dimension, entropy, Bayesian reasoning, graph theory edge cases (vertex cover, maximum clique, maximum flow).\n     - Boolean logic, recursion, or questions involving multiple statements (e.g., \"Statement 1| ... Statement 2| ...\").\n     - Questions with options like \"Depends on the dataset\", \"Not enough information\", or multiple Roman numerals (I., II., III.).\n     - Network analysis tools where the correct answer is niche or less commonly known (e.g., EtterPeak vs. Wireshark).\n\n3. **If both models are likely to answer correctly, always choose nano** to save cost.\n\n4. **If neither model is likely to answer correctly, choose mini**. This avoids under-escalating difficult, failure-prone cases. The risk-averse objective strongly penalizes cases where nano is selected but mini would have been correct.\n\n5. **Never select nano for ambiguous, multi-step, or edge-case questions** where nano may confidently answer incorrectly and mini is more likely to succeed.\n\n6. **Do not attempt to answer the question yourself or provide explanations.** Your only task is to select the model.\n\n7. **Output exactly one token: nano or mini.** No additional text.\n\n**Examples:**\n- \"What is the abbreviation for...\" or \"Which of the following is a standard sorting algorithm?\" \u2192 nano\n- \"What is the output of the following simple for-loop?\" \u2192 nano\n- \"Which of the following is NOT a property of...\" or \"Which tool is used for multiprotocol diverse network analysis?\" (where the correct answer is niche) \u2192 mini\n- \"Statement 1| ... Statement 2| ...\" with subtle theoretical CS content \u2192 mini\n- \"Given this code, what is the output?\" (if the code is complex, multi-branch, or involves tricky state updates) \u2192 mini\n\n**Generalizable Strategy:**\n- Use nano for clear, factual, or basic procedural questions.\n- Use mini for anything that requires careful, multi-step, or nuanced reasoning, or where the answer is likely to be outside the most common knowledge base.\n- When in doubt, prefer mini if there is any risk that nano will confidently answer incorrectly and mini is likely to succeed.\n\n**Your output must always be exactly one token: nano or mini.**"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.20)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.25)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.26)", fillcolor=cyan, tooltip=" "];
    3 [label="3\\n(-0.14)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    0 -> 2;
    0 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
