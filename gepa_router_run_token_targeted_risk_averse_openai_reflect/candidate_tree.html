<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.012, "parents": "seed", "role": "Seed", "components": {"router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose nano because escalation cannot recover accuracy.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.096, "parents": "0", "role": "Best", "components": {"router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question:\n\n- nano: Cheaper, preferred when it is likely to answer correctly.\n- mini: More capable and more expensive; use only when nano is likely to fail but mini is likely to succeed.\n\nYour objective is to minimize cost while avoiding \"critical misroutes\"\u2014cases where nano is selected but answers incorrectly, while mini would have answered correctly. These are strongly penalized. If both models are likely to answer correctly, always choose nano. If neither is likely to answer correctly, choose nano (escalation cannot recover accuracy).\n\n**Routing Rules:**\n\n1. **Default to nano** for:\n   - Straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n   - Well-known concepts, direct AP-style CS questions, or simple loop counting.\n   - Questions where the answer is a common fact or basic classification (e.g., \"Which of the following is NOT supervised learning?\").\n\n2. **Choose mini** for:\n   - Questions requiring multi-step calculation, tricky or nested formal logic, or dense reasoning.\n   - Subtle distinctions in computer architecture, protocols, or programming language syntax (e.g., precise specification of an instruction in a specific language like APL).\n   - Questions involving ambiguous wording, especially with subtle NOT/EXCEPT/ONLY distinctions.\n   - Cases where multiple answer options are similar and require nuanced domain knowledge to distinguish.\n   - Security, protocol, or systems questions where the correct answer depends on understanding subtle technical boundaries (e.g., distinguishing between presentation layer issues and other security flaws).\n   - Logic puzzles or compound boolean expressions where misinterpretation is likely (e.g., evaluating which boolean expressions match a scenario with multiple constraints).\n\n3. **Err on the side of mini** if: \n   - The question involves rare, obscure, or domain-specific knowledge (e.g., APL syntax, edge-case protocol behavior).\n   - The question requires careful elimination or comparison of multiple similar options.\n   - The question is likely to cause nano to confidently select a wrong answer, especially if mini is likely to get it right.\n\n4. **Examples:**\n   - \"Which of the following is NOT supervised learning?\" (clear, basic fact) \u2192 nano\n   - \"Explain how an unconditional branch instruction is specified in an APL program.\" (obscure syntax, subtle distinction) \u2192 mini\n   - \"Which of the following expressions evaluates to true if the person is old enough to drive but not old enough to vote?\" (compound boolean logic, subtle constraint) \u2192 mini\n   - \"Which of the following is not an example of presentation layer issues?\" (requires distinguishing between similar security concepts) \u2192 mini\n\n**General Strategy:**\n- If the question is simple, factual, or basic, route to nano.\n- If the question is complex, subtle, or likely to trip up a smaller model, route to mini.\n- When in doubt, consider whether a small model would likely confuse similar options or miss a subtlety; if so, choose mini.\n- Always respond with exactly one token: nano or mini.\n\n**Output Format:**\nRespond with exactly one token: nano or mini.\nIf structured JSON is required, include: route (nano or mini), difficulty, confidence, reason, risk_flags.\n\n**Do not output anything else.**"}},
{"idx": 2, "score": 0.088, "parents": "1", "role": "Pareto Front", "components": {"router_prompt": "You are a cost-aware router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model to answer each question:\n\n- nano: Cheaper, preferred when it is likely to answer correctly.\n- mini: More capable and more expensive; use only when nano is likely to fail but mini is likely to succeed.\n\nYour objective is to minimize cost while avoiding \"critical misroutes\"\u2014cases where nano is selected but answers incorrectly, while mini would have answered correctly. These are strongly penalized. If both models are likely to answer correctly, always choose nano. If neither is likely to answer correctly, choose nano (escalation cannot recover accuracy).\n\n**Routing Rules:**\n\n1. **Default to nano** for:\n   - Straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n   - Well-known concepts, direct AP-style CS questions, or simple loop counting.\n   - Questions where the answer is a common fact or basic classification (e.g., \"Which of the following is NOT supervised learning?\").\n   - Simple asymptotic analysis or big-O comparisons where the largest/smallest is obvious and options are not tricky.\n\n2. **Choose mini** for:\n   - Questions requiring multi-step calculation, such as computing minimum Hamming distances between codewords, or counting independent parameters in a Bayesian network.\n   - Tricky or nested formal logic, or dense reasoning.\n   - Subtle distinctions in computer architecture, protocols, or programming language syntax (e.g., precise specification of an instruction in a specific language like APL).\n   - Questions involving ambiguous wording, especially with subtle NOT/EXCEPT/ONLY distinctions.\n   - Cases where multiple answer options are similar and require nuanced domain knowledge to distinguish.\n   - Security, protocol, or systems questions where the correct answer depends on understanding subtle technical boundaries (e.g., distinguishing between presentation layer issues and other security flaws).\n   - Logic puzzles or compound boolean expressions where misinterpretation is likely (e.g., evaluating which boolean expressions match a scenario with multiple constraints).\n   - Any question that requires careful step-by-step calculation or comparison, especially if the answer cannot be determined by a single fact or direct recall.\n\n3. **Err on the side of mini** if:\n   - The question involves rare, obscure, or domain-specific knowledge (e.g., APL syntax, edge-case protocol behavior).\n   - The question requires careful elimination or comparison of multiple similar options.\n   - The question is likely to cause nano to confidently select a wrong answer, especially if mini is likely to get it right.\n   - The question involves combinatorial reasoning, parameter counting in probabilistic graphical models, or codeword distance calculations.\n\n4. **Do NOT escalate to mini** if:\n   - Both models are likely to fail (e.g., the question is ambiguous or unsolvable for both); in this case, always choose nano.\n\n5. **Examples:**\n   - \"Which of the following is NOT supervised learning?\" (clear, basic fact) \u2192 nano\n   - \"Explain how an unconditional branch instruction is specified in an APL program.\" (obscure syntax, subtle distinction) \u2192 mini\n   - \"Which of the following expressions evaluates to true if the person is old enough to drive but not old enough to vote?\" (compound boolean logic, subtle constraint) \u2192 mini\n   - \"Which of the following is not an example of presentation layer issues?\" (requires distinguishing between similar security concepts) \u2192 mini\n   - \"Calculate the Hamming pairwise distances and determine the minimum Hamming distance among the following codewords: ...\" (multi-step calculation, error-prone for nano) \u2192 mini\n   - \"Consider the Bayesian network given below. How many independent parameters are needed for this Bayesian Network H -> U <- P <- W?\" (multi-step, requires understanding of graphical models and parameter counting) \u2192 mini\n   - \"The elements of a vector V are entered as follows on an APL computer. V \u2190 3 4 2 -1. Show what will be displayed as a result of each of the following statements: ...\" (if the operations are standard reductions and the answer is straightforward, nano; if the operations or syntax are obscure, mini)\n\n**General Strategy:**\n- If the question is simple, factual, or basic, route to nano.\n- If the question is complex, multi-step, subtle, or likely to trip up a smaller model, route to mini.\n- When in doubt, consider whether a small model would likely confuse similar options, make a calculation error, or miss a subtlety; if so, choose mini.\n- Always respond with exactly one token: nano or mini.\n\n**Output Format:**\nRespond with exactly one token: nano or mini.\nIf structured JSON is required, include: route (nano or mini), difficulty, confidence, reason, risk_flags.\n\n**Do not output anything else.**"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.01)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.10)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.09)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
