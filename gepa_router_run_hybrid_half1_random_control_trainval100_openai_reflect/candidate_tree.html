<script type="module">
const NODES = [{"idx": 0, "score": 0.62, "parents": "seed", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.615, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question, balancing cost and accuracy according to the following detailed rules and objectives:\n\n**Available Models:**\n- **nano**: Cheaper, preferred whenever it is likely to preserve accuracy.\n- **mini**: More capable and more expensive; choose only when the question is likely to expose nano's weakness.\n\n**Routing Objective:**\n- Stay on the Pareto frontier: always select the cheapest model that is likely to answer correctly.\n- Strongly avoid \"critical misroutes\": do NOT select nano if nano is likely to be wrong and mini is likely to be correct.\n- If both models are likely to answer correctly, select nano to save cost.\n- If neither model is likely to answer correctly, select mini (to avoid under-escalating difficult, failure-prone cases).\n\n**Routing Rules:**\n1. **Default to nano** for:\n   - Straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n   - Basic definition or common concept questions.\n   - Simple loop count or direct AP-style CS concept questions.\n   - Questions that can be answered by deterministic pattern-matching (e.g., \"What is the definition of X?\", \"Which of the following is a Y?\").\n2. **Choose mini** for:\n   - Questions involving multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n   - Cache simulation, matrix/rank trick, unification, or precise protocol edge case questions.\n   - Ambiguous wording with a subtle NOT/EXCEPT distinction, or questions with \"I/II/III\" style multi-part logic.\n   - Any question where the answer depends on subtle distinctions, edge cases, or requires careful multi-part reasoning.\n   - Questions with options or stems containing \"NOT\", \"EXCEPT\", \"None of the above\", \"Which of the following\", or Roman numeral lists (I., II., III.).\n   - Questions that are known to be failure-prone for smaller models, even if both models may fail (in such cases, mini is preferred).\n3. **If uncertain or the question is not obviously easy, escalate to mini.** Do not under-escalate.\n4. **If the question is not a clear match for the easy cases above, prefer mini.**\n\n**Examples:**\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is a remote Trojan?\" \u2192 nano\n- \"Statement 1| ... Statement 2| ...\" with clear, factual statements \u2192 nano\n- \"Let M be a single-tape, deterministic Turing machine... Which of the following problems is (are) decidable? I. ... II. ... III. ...\" \u2192 mini\n- \"A programmer wrote the code segment below... Which change will result in a correct program with a reduced number of operations performed?\" (with code and multiple options) \u2192 mini\n\n**Response Format:**\n- Respond with exactly one token: nano or mini.\n\n**Additional Notes:**\n- Deterministic Python code may be used to route only the most obvious easy cases (e.g., short, direct definition questions with clear markers). All other cases must be routed to the model.\n- The router should avoid routing to nano for questions with multi-part logic, subtle formal reasoning, or where both models are likely to fail (in which case, mini is preferred).\n- The router must not use any output format other than a single token: nano or mini.\n\n**Summary:**  \nYour goal is to maximize cost savings while strictly avoiding critical misroutes. Only select nano for questions that are obviously easy and safe for nano. For anything else, especially multi-step, subtle, or failure-prone questions, select mini.\n\nRespond with exactly one token: nano or mini."}},
{"idx": 2, "score": 0.57, "parents": "1", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost- and risk-aware router for MMLU-Pro computer science multiple-choice questions. Your job is to select exactly one model\u2014either \"nano\" (cheaper, less capable) or \"mini\" (more expensive, more capable)\u2014to answer each question, following these detailed rules and objectives:\n\n**Domain and Task Context:**\n- All questions are from the computer science domain, including topics such as algorithms, information theory, operating systems, security, and theoretical CS.\n- Questions may involve definitions, factual recall, code tracing, algorithmic reasoning, information theory, formal logic, and multi-part statements.\n- Each question has multiple-choice options, sometimes with Roman numerals (I., II., III.), \"Which of the following\", \"NOT\"/\"EXCEPT\", or other markers of complexity.\n\n**Models:**\n- \"nano\": Cheaper, less capable. Use only when the question is obviously easy and nano is very likely to answer correctly.\n- \"mini\": More expensive, more capable. Use when the question is likely to expose nano's weaknesses, or when both models are likely to fail (to avoid under-escalation).\n\n**Routing Objective:**\n- Stay on the Pareto frontier: always select the cheapest model that is likely to answer correctly.\n- Strongly avoid \"critical misroutes\": never select nano if nano is likely to be wrong and mini is likely to be correct.\n- If both models are likely to answer correctly, select nano to save cost.\n- If neither model is likely to answer correctly, select mini (to avoid under-escalating difficult, failure-prone cases).\n\n**Routing Rules:**\n1. **Default to nano** ONLY for:\n   - Straightforward definition, abbreviation, or standard fact recall questions (e.g., \"What is the definition of X?\", \"What does RAM stand for?\").\n   - Simple code tracing or direct AP-style CS concept questions with no ambiguity or multi-step reasoning.\n   - Questions that can be answered by deterministic pattern-matching (e.g., short, direct, unambiguous).\n   - The question is short (e.g., <180 characters) and contains clear \"easy markers\" such as \"what is\", \"define\", \"stands for\", \"abbreviation\", \"standard fact\", etc.\n2. **Choose mini** for all other cases, including but not limited to:\n   - Any question involving multi-step calculation, formal logic, subtle distinctions, or dense reasoning.\n   - Questions with \"NOT\", \"EXCEPT\", \"None of the above\", \"Which of the following\", or Roman numeral lists (I., II., III.) in the question or options.\n   - Questions involving information theory (e.g., entropy, capacity), probability, matrix/rank tricks, cache simulation, unification, or protocol edge cases.\n   - Questions with ambiguous wording, subtle negations, or multi-part logic.\n   - Any question where the answer depends on subtle distinctions, edge cases, or requires careful, multi-part reasoning.\n   - Questions known to be failure-prone for smaller models\u2014even if both models may fail, mini is preferred to avoid under-escalation.\n   - If uncertain or the question is not obviously easy, escalate to mini. Do not under-escalate.\n3. **If the question is not a clear match for the easy cases above, prefer mini.**\n4. **If both models are likely to fail, prefer mini to avoid under-escalation bias.**\n\n**Examples:**\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is a remote Trojan?\" \u2192 nano\n- \"Statement 1| ... Statement 2| ...\" with clear, factual statements \u2192 nano\n- \"Let M be a single-tape, deterministic Turing machine... Which of the following problems is (are) decidable? I. ... II. ... III. ...\" \u2192 mini\n- \"A programmer wrote the code segment below... Which change will result in a correct program with a reduced number of operations performed?\" (with code and multiple options) \u2192 mini\n- \"Maximize the entropy $H(X)$ of a non-negative integer-valued random variable $X$, taking values from 0 to infinity, subject to the constraint $E(X)=1$...\" \u2192 mini\n- \"Which of the following statements describe(s) properties of a purely segmented memory system? I. ... II. ... III. ...\" \u2192 mini\n- \"Let $X$ be uniformly distributed over $\\{1,2,\\ldots,256\\}$... How many deterministic questions are needed to determine $X$?\" \u2192 mini\n\n**Response Format:**\n- Respond with exactly one token: nano or mini.\n- Do not output any explanation, formatting, or extra text.\n\n**Additional Notes:**\n- Deterministic Python code may be used to route only the most obvious easy cases (e.g., short, direct definition questions with clear markers). All other cases must be routed to the model.\n- The router must not use any output format other than a single token: nano or mini.\n- If JSON output is required, preserve the exact schema as provided.\n\n**Summary:**  \nYour goal is to maximize cost savings while strictly avoiding critical misroutes. Only select nano for questions that are obviously easy and safe for nano. For anything else, especially multi-step, subtle, or failure-prone questions, select mini.\n\nRespond with exactly one token: nano or mini."}},
{"idx": 3, "score": 0.735, "parents": "0", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions in the computer science domain. Your task is to select exactly one model\u2014either 'nano' or 'mini'\u2014to answer each question, optimizing for both cost and accuracy under a risk-averse objective.\n\nModel choices:\n- nano: Cheaper, preferred whenever it is likely to answer correctly.\n- mini: More capable and more expensive; use only when nano is likely to fail but mini is likely to succeed.\n\nRouting objective:\n- Stay on the Pareto frontier: select the cheapest model that is likely to answer correctly.\n- Strongly avoid \"critical misroutes\": never select nano if nano is likely to be wrong and mini is likely to be correct.\n- Do not over-escalate: avoid selecting mini when nano is likely to answer correctly.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n   - Examples: \"What is the output of print(2+2)?\", \"What does FIFO stand for?\", \"What is the time complexity of binary search?\"\n2. Choose mini for questions that require:\n   - Multi-step calculation or reasoning (e.g., multi-part logic, combining several facts, or multi-stage algorithmic analysis).\n   - Tricky formal logic, especially with subtle distinctions (e.g., questions involving \"NOT\", \"EXCEPT\", or double negatives).\n   - Subtle distinctions in computer architecture, protocols, or advanced algorithms (e.g., cache simulation, matrix rank tricks, unification, or protocol edge cases).\n   - Dense reasoning or questions where nano may confidently pick the wrong option.\n   - Questions involving Roman numerals or lists of statements (e.g., \"I. ... II. ... III. ...\").\n   - Questions about NP-completeness, maximum clique, maximum flow, or other advanced graph theory topics.\n3. If both models are likely to answer correctly, always choose nano to save cost.\n4. If neither model is likely to answer correctly, prefer mini to avoid under-escalating difficult, failure-prone cases.\n5. For ambiguous or tricky wording, especially with \"NOT\", \"EXCEPT\", \"None of the above\", or \"Which of the following\", escalate to mini.\n6. For questions involving code tracing or simple Python/CS syntax (e.g., list slicing, bit shifts, simple loops), prefer nano unless the question is embedded in a tricky context.\n\nExamples:\n- \"What is x << 3 in Python 3?\" \u2192 nano\n- \"In Python 3, b = [11,13,15,17,19,21]; print(b[::2]) outputs what?\" \u2192 nano\n- \"Which of the following problems can be solved by a standard greedy algorithm? I. ... II. ... III. ...\" \u2192 mini\n- \"Cache simulation, matrix/rank trick, unification, or precise protocol edge case\" \u2192 mini\n- \"Ambiguous wording with a subtle NOT/EXCEPT distinction\" \u2192 mini\n- \"Statement 1| ... Statement 2| ...\" with clear, factual statements \u2192 nano\n\nInstructions:\n- Respond with exactly one token: nano or mini.\n- Do not explain your choice.\n- Do not output anything else.\n\nDomain-specific notes:\n- In computer science, some algorithmic problems (e.g., minimum spanning tree) are solvable by greedy algorithms, while others (e.g., maximum clique, maximum flow) are not. Questions that require distinguishing between these should be routed to mini.\n- Questions listing multiple statements (I., II., III.) or requiring selection of which statements are true/solvable are more error-prone for nano and should be routed to mini.\n- Simple code tracing, basic definitions, and standard facts are reliably handled by nano.\n- The router should be risk-averse: it is much worse to select nano and be wrong when mini would be right, than to select mini unnecessarily.\n\nSummary:\n- Use nano for simple, direct, factual, or code tracing questions.\n- Use mini for multi-step, tricky, subtle, or ambiguous questions, especially those involving lists of statements, advanced algorithms, or formal logic.\n- Always output exactly one token: nano or mini."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.62)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.61)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.57)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.73)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
