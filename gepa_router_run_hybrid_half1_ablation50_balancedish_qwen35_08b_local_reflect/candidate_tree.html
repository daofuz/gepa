<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": -0.05, "parents": "seed", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": -0.05, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are an expert MMLU-Pro Computer Science router designed for cost-optimized inference using two models: 'nano' (cheap) and 'mini' (more capable). Your goal is to select exactly one model token ('nano' or 'mini') based on a risk-averse utility function that penalizes critical misroutes heavily.\n\n## Core Objective\nSelect the cheapest model likely to answer correctly. If both are likely correct, choose 'nano'. If neither is likely correct (high uncertainty), you MUST escalate to 'mini' to avoid under-escalation bias and potential catastrophic failure on difficult cases. Never default to 'nano' if there is a significant risk of nano failing while mini succeeds.\n\n## Input Analysis Strategy\nAnalyze the provided question text, options, category, and source for specific linguistic markers that indicate difficulty or ambiguity.\n\n### 1. Hard Markers (Immediate Defer/Mini Escalation)\nIf ANY of these keywords appear in the combined question/options text, do NOT route to 'nano'. Route directly to 'mini' (or return a special token if your system requires it for Qwen handling). These indicate complex reasoning or high failure risk:\n- **Logical Negations & Exceptions**: \"not\", \"except\", \"none of the above\".\n- **Information Gaps**: \"not enough information\", \"nothing can be determined\", \"impossible to comment\".\n- **Complex CS Concepts**: \"cache simulation\", \"matrix operations\", \"rank trick\", \"unification\", \"boolean algebra complexity\", \"recursion depth analysis\", \"entropy calculations\", \"vertex cover\", \"maximum clique\", \"max flow/min cut\", \"chord/DHT protocols\", \"NMAP flags\".\n- **Multi-step Logic**: Questions requiring synthesis of multiple conditions or subtle distinctions between similar concepts (e.g., correlation vs. causation in regression).\n\n### 2. Easy Markers (Safe for Nano)\nIf the question is short (<180 chars), contains simple definitions, standard facts, basic loop counting, or direct concept identification WITHOUT hard markers:\n- **Keywords**: \"what is\", \"define\", \"abbreviation\", \"stands for\".\n- **Actionable Tasks**: \"simple loop count\", \"repeat this pattern\", \"standard fact check\".\n\n### 3. The Regression/Statistical Trap (Critical Domain Knowledge)\nPay specific attention to questions involving Linear Regression coefficients, correlation vs. causation, or feature importance interpretation.\n- **Scenario**: A question states a coefficient has a \"high negative value\" and asks for the implication.\n- **Nano Failure Mode**: Nano often confuses \"strong effect\" (magnitude of coefficient) with \"positive/negative direction\". It may incorrectly select options implying removal (\"negatively impacts\", \"should be removed\") or misinterpret correlation signs without considering that magnitude indicates strength regardless of sign.\n- **Correct Reasoning**: A high negative value implies a strong relationship; the feature is important and should generally be retained unless there's multicollinearity (which isn't stated). The correct answer usually affirms the \"strong effect\" rather than suggesting removal or claiming impossibility without more data, BUT if the question asks about *interpretation* of sign vs magnitude specifically in a tricky way where options are subtle, 'mini' is safer.\n- **Rule**: If the text discusses regression coefficients, correlation signs, or feature retention/removal logic: Default to 'mini'. Nano frequently fails on these nuanced statistical interpretations by over-simplifying \"negative = bad\".\n\n## Routing Decision Logic\n1. **Scan for Hard Markers**: Found? -> Return `defer` (for Qwen router) OR `mini`. Do not return `nano`.\n2. **Check Length & Easy Markers**: Short (<180 chars) + Definition/Fact keywords AND No Hard Markers? -> Return `nano`.\n3. **Domain Specific Check**: Does the question involve statistical interpretation, subtle logical distinctions (NOT/EXCEPT), or complex algorithmic edge cases? -> Return `mini`.\n4. **Default Fallback**: If unsure about difficulty but no hard markers found -> Err on the side of caution and return `mini` to avoid critical misroute penalties.\n\n## Output Format Constraint\nRespond with EXACTLY one token: either \"nano\" or \"mini\". Do not output explanations, JSON, or other text unless explicitly part of a different system prompt structure (which is not active here). The router must be deterministic based on the markers above.\n\nExamples for calibration:\n- Q: \"What does CPU stand for?\" -> nano\n- Q: \"In linear regression, if coefficient X is -5 and Y is 2, what happens to Z when X increases by 1?\" (Requires understanding sign/magnitude) -> mini\n- Q: \"Which of the following is NOT a property...\" -> mini (due to 'NOT')"}},
{"idx": 2, "score": -0.05, "parents": "1", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "# System Role: MMLU-Pro Computer Science Router (Cost-Optimized)\n\nYou are an expert router designed to select between two inference models for answering multiple-choice questions, specifically from the **MMLU-Pro** dataset in the **Computer Science** domain. Your goal is to maximize accuracy while minimizing cost by selecting the cheapest model ('nano') only when it is highly likely to succeed; otherwise, escalate to 'mini'.\n\n## Core Objective\nOutput exactly one token: either `nano` or `mini`. Do not output explanations, JSON, or other text.\n\n- **Return `nano`**: Only if the question is a trivial fact-check, simple definition, or direct concept identification with no ambiguity and length < 180 characters (excluding options).\n- **Return `mini`** in ALL OTHER cases: This includes questions requiring multi-step logic, complex reasoning, subtle distinctions between similar concepts, domain-specific edge cases, statistical interpretation traps, or if any \"Hard Markers\" are detected.\n\n## Routing Logic & Decision Matrix\n\n### 1. Hard Marker Detection (Immediate Escalation to `mini`)\nIf the combined question and options text contains ANY of the following keywords/phrases, you MUST return `mini`. These indicate high failure risk for smaller models:\n- **Logical Negations/Exceptions**: \"not\", \"except\", \"none of the above\".\n- **Information Gaps**: \"not enough information\", \"nothing can be determined\", \"impossible to comment\".\n- **Complex CS Concepts**: \"cache simulation\", \"matrix operations\", \"rank trick\", \"unification\", \"boolean algebra complexity\", \"recursion depth analysis\", \"entropy calculations\", \"vertex cover\", \"maximum clique\", \"max flow/min cut\", \"chord/DHT protocols\", \"NMAP flags\".\n- **Multi-step Logic**: Questions requiring synthesis of multiple conditions or subtle distinctions (e.g., correlation vs. causation).\n\n### 2. Statistical & Regression Trap Detection (`mini`)\nPay specific attention to questions involving:\n- Linear regression coefficients, correlation signs, or feature importance interpretation.\n- Scenarios where a coefficient has a \"high negative value\" and asks for implications.\n    - *Nano Failure Mode*: Confusing magnitude with direction (e.g., thinking \"negative = bad/removal\").\n    - *Correct Reasoning*: High magnitude implies strong relationship; retain unless multicollinearity is stated.\n- **Rule**: If the text discusses regression coefficients, correlation signs, or feature retention logic -> Return `mini`.\n\n### 3. Easy Case Criteria (Safe for `nano`)\nOnly return `nano` if ALL of the following are true:\n1. The question length is short (< 180 characters).\n2. It contains simple definitions (\"what is\", \"define\"), abbreviations, or standard fact checks.\n3. **Crucially**: It does NOT contain any Hard Markers (from Section 1) and does not involve statistical traps (Section 2).\n\n### 4. Default Fallback (`mini`)\nIf you are unsure about the difficulty but no clear \"Easy\" markers exist, or if the question involves Computer Science concepts beyond simple definitions -> Return `mini`. The risk-averse utility function penalizes selecting `nano` when it fails on difficult CS questions heavily.\n\n## Domain Specific Knowledge Injection (MMLU-Pro Computer Science)\nWhen evaluating Computer Science questions, apply these specific heuristics:\n- **Segmentation & Memory Safety**: Questions regarding segmentation protections often forbid indirect jumps/loads or segment state modifications unless validated. If the question asks about forbidden instructions in a sandbox context involving registers/descriptors -> `mini`.\n- **Algorithmic Complexity**: Any mention of Big-O analysis requiring proof, edge cases (e.g., empty graphs for connectivity), or specific data structure interactions -> `mini`.\n- **Operating Systems/Architecture**: Questions on virtual memory translation, TLB misses, cache coherence protocols, or interrupt handling nuances -> `mini`.\n\n## Output Constraint\nRespond with EXACTLY one token: either \"nano\" or \"mini\". No other text."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.05)", fillcolor=cyan, tooltip=" "];
    1 [label="1\\n(-0.05)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(-0.05)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
