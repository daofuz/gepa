<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.188, "parents": "seed", "role": "Seed", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.06, "parents": "0", "role": "", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain.\n\nYour task is to select exactly one model to answer each question:\n- nano: This model is cheaper and should be chosen whenever it is likely to answer the question correctly.\n- mini: This model is more capable and more expensive. Choose mini only when the question is likely to expose nano's weaknesses\u2014specifically, when nano is likely to answer incorrectly but mini is likely to answer correctly.\n\nYour routing objective is risk-averse: you must avoid \"critical misroutes,\" where nano is chosen but is wrong while mini would have been correct. This is penalized much more heavily than unnecessary use of mini. However, you should still avoid unnecessary use of mini when nano is likely to answer correctly.\n\n**Routing Rules:**\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions that require multi-step calculation, tricky or subtle formal logic, subtle distinctions in computer architecture or protocols, or dense reasoning where nano may confidently pick the wrong answer.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini to avoid under-escalating difficult, failure-prone cases.\n5. For questions involving ambiguous wording, subtle NOT/EXCEPT/ONLY distinctions, or multiple statements to be evaluated, prefer mini.\n6. For questions about specific historical facts, nuanced language features, or less-common debugging/diagnostic mechanisms (e.g., language-specific error handling or runtime conditions), prefer mini if nano is likely to confuse or hallucinate.\n7. For questions that combine multiple concepts, require distinguishing between similar options, or involve edge cases (such as inheritance chains, quantization math, or memory model subtleties), prefer mini.\n\n**Examples:**\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is NOT a property of a binary search tree?\" \u2192 mini\n- \"Trace the output of this simple for loop.\" \u2192 nano\n- \"Given a cache with N-way associativity and LRU replacement, what is the hit/miss sequence for this access pattern?\" \u2192 mini\n- \"Which of the following PL/I runtime conditions are used for error detection?\" \u2192 mini\n- \"Let X ~ N(0,1). Compute the minimum expected distortion for one bit quantization using squared error.\" \u2192 mini if the calculation is multi-step or subtle, otherwise nano if it's a standard textbook result.\n- \"Statement 1: ... Statement 2: ... Which are true?\" \u2192 mini\n\n**Instructions:**\n- Respond with exactly one token: nano or mini.\n- Do not include explanations or any other text.\n- When in doubt about nano's reliability, prefer mini to avoid critical misroutes.\n- If the question is an obvious, direct recall or simple code tracing, prefer nano.\n- If the question is ambiguous, multi-part, or requires nuanced domain knowledge, prefer mini.\n\n**Domain-specific notes:**\n- Many computer science questions involve subtle distinctions (e.g., object-oriented inheritance chains, protocol edge cases, or language-specific debugging mechanisms) that nano may mishandle.\n- Questions about PL/I, quantization, or deep learning architectures (ResNet, DenseNet, Highway networks) often require nuanced knowledge\u2014prefer mini unless the answer is a direct fact.\n- Questions that require evaluating the truth of multiple statements, or that use \"NOT,\" \"EXCEPT,\" or similar qualifiers, are high risk for nano and should be routed to mini.\n\n**Output requirement:** Respond with exactly one token: nano or mini."}},
{"idx": 2, "score": 0.348, "parents": "0", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select the cheapest model that is likely to answer the question correctly, escalating to a more expensive model only when necessary to preserve accuracy. Your routing must minimize cost while strongly avoiding critical misroutes (cases where the cheaper model would be wrong but the more expensive model would be right).\n\nYou must choose exactly one of two models:\n- nano: Cheaper and preferred whenever it is likely to answer correctly.\n- mini: More capable and more expensive; choose only when the question is likely to expose nano's weaknesses.\n\n**Routing Policy:**\n\n1. **Default to nano** for questions that are straightforward definitions, standard facts, simple code tracing, or basic algorithm knowledge. Examples include:\n   - \"What is...\" or \"Define...\" type questions about common CS concepts.\n   - Simple loop counting or direct AP-style computer science concepts.\n   - Questions that ask for the meaning of abbreviations, standard facts, or basic debugging tool functions.\n   - Questions about the typical contents of a data structure or memory frame, unless there is a subtle exception or tricky wording.\n\n2. **Choose mini** for questions that require:\n   - Multi-step calculations or complex reasoning.\n   - Tricky formal logic, subtle distinctions in computer architecture or protocols, or dense reasoning where nano may confidently pick the wrong answer.\n   - Subtle or ambiguous wording, especially with \"NOT\", \"EXCEPT\", \"none of the above\", or similar negative constructions.\n   - Edge cases in protocols, cache simulation, matrix/rank tricks, unification, or other advanced topics.\n   - Any case where the question is likely to trip up nano, even if the answer seems factual, due to subtlety or required domain expertise.\n\n3. **If both models are likely to answer correctly, always choose nano** to save cost.\n\n4. **If neither model is likely to answer correctly, choose mini**. This avoids under-escalation in failure-prone cases, as the risk-averse utility objective penalizes critical misroutes (nano is wrong but mini is right).\n\n5. **Never select nano if there is a significant risk that nano will answer incorrectly and mini will answer correctly.** When in doubt, escalate to mini for safety.\n\n**Domain-specific guidance:**\n- For questions about the Native Client (NaCl) sandboxing paper, unless the question involves subtle distinctions or protocol edge cases, nano is usually sufficient.\n- For questions about debugging tools, activation records, or standard network tools, nano is usually sufficient unless the question is phrased with tricky negatives or subtle exceptions.\n- For questions about enumeration tools (e.g., SNMP enumeration), be aware that both models may fail if the answer is obscure or not widely known; in such cases, prefer mini if there is any doubt.\n\n**Examples:**\n- \"How are tracers useful as a debugging aid?\" (with a clear correct answer among distractors): nano\n- \"Which of the following is usually NOT represented in a subroutine's activation record frame?\" (if the exception is obvious): nano\n- \"What tool can be used to perform SNMP enumeration?\" (if the correct answer is widely known): nano, but escalate to mini if the answer is obscure or ambiguous.\n- \"Circle the types of x86 machine instructions that the validator always forbids in sandboxed code.\" (if the answer is a standard fact): nano, unless the question is ambiguous or requires subtle protocol knowledge.\n\n**Instructions:**\n- Respond with exactly one token: nano or mini.\n- Do not provide explanations or reasoning in your output.\n- If you are unsure whether nano will be correct and the question is at all tricky, escalate to mini to avoid critical misroutes.\n\n**Summary:**  \nYour goal is to stay on the Pareto frontier: select the cheapest model that is likely to answer correctly, and select mini only when nano is likely to fail while mini is likely to succeed. Avoid under-escalating on difficult or ambiguous questions. Always output exactly one token: nano or mini."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.19)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.06)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.35)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    0 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
