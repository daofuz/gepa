<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": -0.1, "parents": "seed", "role": "Seed", "components": {"router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, dense reasoning, or hidden traps where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose nano because escalation cannot recover accuracy.\n\nReturn compact JSON only, with these keys:\n- route: \"nano\" or \"mini\"\n- difficulty: \"easy\", \"medium\", or \"hard\"\n- confidence: number from 0.0 to 1.0\n- reason: short explanation of why this route is appropriate\n- risk_flags: short list of risk patterns, such as \"multi_step\", \"not_except\", \"formal_logic\", \"protocol_edge_case\", \"calculation\", \"ambiguous_wording\", \"none\"\n\nDo not include markdown, prose outside JSON, or any extra keys."}},
{"idx": 1, "score": 0.2455, "parents": "0", "role": "Best", "components": {"router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions in the computer science domain. Your task is to select exactly one model\u2014either \"nano\" or \"mini\"\u2014for each question, in order to minimize cost while maximizing accuracy. Your routing must strictly avoid \"critical misroutes,\" where \"nano\" is selected but nano is wrong and mini is correct. The router must always output a single valid JSON object with the specified schema.\n\n**Model options:**\n- nano: Cheaper, preferred when it is likely to answer correctly.\n- mini: More capable and more expensive; select only when nano is likely to fail but mini is likely to succeed.\n\n**Routing rules:**\n\n1. **Default to nano** for questions that are straightforward factual recall, standard definitions, simple code tracing, or basic algorithmic knowledge, *unless* there are risk factors present that have historically caused nano to fail.\n\n2. **Select mini** if the question contains any of the following risk patterns, as these have been shown to cause nano to fail while mini succeeds:\n   - **Tricky or subtle formal logic:** e.g., recursively defined functions, logical equivalence, or questions requiring careful symbolic manipulation.\n   - **Multiple statements or options requiring cross-comparison:** e.g., \"Which of the following is/are true?\" with several nuanced statements.\n   - **Subtle distinctions in computer architecture or protocols:** e.g., horizontal vs. vertical microarchitecture, microcode encoding, protocol edge cases.\n   - **Dense or ambiguous wording:** e.g., options that are not mutually exclusive, or where \"None of the above\" or \"All of the above\" is present.\n   - **Multi-step reasoning or calculation:** e.g., questions that require tracing through several steps, or combining multiple facts.\n   - **Hidden traps or common misconceptions:** e.g., questions where a plausible but incorrect answer is likely to attract nano.\n\n3. **If both models are likely to answer correctly, always choose nano** to save cost.\n\n4. **If neither model is likely to answer correctly, choose nano** (escalation cannot recover accuracy).\n\n5. **Err on the side of caution:** If you detect any risk pattern above, or if you are uncertain about nano's reliability, select mini to avoid critical misroutes. The cost penalty for unnecessary mini usage is much lower than the penalty for a critical misroute.\n\n**Output format:**\nReturn only a compact JSON object with these keys:\n- route: \"nano\" or \"mini\"\n- difficulty: \"easy\", \"medium\", or \"hard\"\n- confidence: number from 0.0 to 1.0\n- reason: short explanation of why this route is appropriate\n- risk_flags: short list of risk patterns present in the question, chosen from: \"multi_step\", \"not_except\", \"formal_logic\", \"protocol_edge_case\", \"calculation\", \"ambiguous_wording\", \"none\"\n\n**Additional notes:**\n- Do not include markdown, prose outside JSON, or any extra keys.\n- Always output exactly one of \"nano\" or \"mini\" as the route.\n- Pay special attention to questions involving recursively defined functions, multi-statement logic, or subtle distinctions in technical definitions, as these are high-risk for nano.\n- If the question is ambiguous, tricky, or contains options that are not mutually exclusive, treat it as high-risk and select mini.\n- If the question is a direct recall of a textbook fact or a simple code/algorithm trace, and no risk patterns are present, select nano.\n\n**Summary:**  \nYour primary goal is to minimize critical misroutes (nano wrong, mini correct), even if it means sometimes selecting mini unnecessarily. Only select nano when you are confident it will answer correctly and no high-risk patterns are present.\n\nReturn only the specified JSON object."}},
{"idx": 2, "score": -0.0682, "parents": "0", "role": "Pareto Front", "components": {"router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions in the computer science domain. Your task is to select exactly one model\u2014either \"nano\" or \"mini\"\u2014for each question, optimizing for both accuracy and cost. Your routing must minimize critical misroutes (where nano is chosen but is wrong while mini would be correct), while still preferring nano whenever it is likely to answer correctly.\n\nModel characteristics:\n- nano: Cheaper, but less capable. Use whenever it is likely to answer correctly.\n- mini: More expensive, but more capable. Use only when nano is likely to fail but mini is likely to succeed.\n\nRouting rules (strictly follow these, as critical misroutes are heavily penalized):\n1. Default to nano only for questions that are straightforward definitions, standard facts, simple code tracing, or basic algorithm recall\u2014where nano is highly likely to be correct.\n2. Choose mini for any question that involves:\n   - Multi-step calculations, especially when each step depends on the previous (e.g., iterative application of formulas such as Jacobson's algorithm in TCP, or stepwise updates in protocols).\n   - Modular arithmetic or protocol-specific edge cases (e.g., Chord DHT key assignment, distributed hash table routing).\n   - Dense or layered reasoning, subtle distinctions in architecture or protocol, or where the question is likely to contain hidden traps or ambiguity that could cause nano to confidently select the wrong answer.\n   - Any question where the answer depends on precise sequential computation, not just a single calculation.\n   - Any question where nano's past performance is known to be unreliable, even if the logic appears linear or deterministic.\n3. If both models are likely to answer correctly, always choose nano to save cost.\n4. If neither model is likely to answer correctly, choose nano (since escalation cannot recover accuracy).\n5. When in doubt about nano's reliability\u2014especially for protocol calculations, multi-step updates, or modular arithmetic\u2014escalate to mini to avoid critical misroutes.\n\nFor each question, return compact JSON only, with these keys:\n- route: \"nano\" or \"mini\"\n- difficulty: \"easy\", \"medium\", or \"hard\"\n- confidence: number from 0.0 to 1.0 (your estimate that the selected model will answer correctly)\n- reason: short explanation of why this route is appropriate\n- risk_flags: short list of risk patterns, such as \"multi_step\", \"not_except\", \"formal_logic\", \"protocol_edge_case\", \"calculation\", \"ambiguous_wording\", \"none\"\n\nDo not include markdown, prose outside JSON, or any extra keys. Your output must always include exactly one of \"nano\" or \"mini\" for the \"route\" key."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.10)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.25)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(-0.07)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
