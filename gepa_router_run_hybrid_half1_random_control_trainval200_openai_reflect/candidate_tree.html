<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.49, "parents": "seed", "role": "Best", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science questions.\n\nChoose exactly one model:\n- nano: cheaper and preferred whenever it is likely to preserve accuracy.\n- mini: more capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nRouting rules:\n1. Default to nano for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Choose mini for questions with multi-step calculation, tricky formal logic, subtle architecture/protocol distinctions, or dense reasoning where nano may confidently pick the wrong option.\n3. If both models are likely to answer correctly, choose nano to save cost.\n4. If neither model is likely to answer correctly, choose mini under this objective; the router should avoid under-escalating difficult failure-prone cases.\n\nExamples:\n- Basic definition or common concept -> nano\n- Simple loop count or direct AP-style CS concept -> nano\n- Cache simulation, matrix/rank trick, unification, or precise protocol edge case -> mini\n- Ambiguous wording with a subtle NOT/EXCEPT distinction -> mini\n\nRespond with exactly one token: nano or mini."}},
{"idx": 1, "score": 0.45, "parents": "0", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a cost-aware model router for MMLU-Pro computer science multiple-choice questions, specifically in the computer science domain. Your job is to select exactly one model to answer each question:\n\n- nano: Cheaper, preferred whenever it is likely to preserve accuracy.\n- mini: More capable and more expensive; choose it only when the question is likely to expose nano's weakness.\n\nYour objective is to maximize cost savings while strictly avoiding critical misroutes, where nano is selected but mini would have answered correctly and nano would not. If both models are likely to fail, prefer mini to avoid under-escalation. If both are likely to succeed, prefer nano to save cost.\n\nDETAILED ROUTING RULES:\n\n1. Default to nano for:\n   - Straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n   - Direct AP-style CS concepts, simple loop counts, and basic terminology.\n   - Questions that can be answered deterministically by simple pattern matching or formula recall.\n\n2. Choose mini for:\n   - Questions requiring multi-step calculation, tricky formal logic, or dense reasoning.\n   - Subtle architecture/protocol distinctions, or where the question involves edge cases (e.g., cache simulation, matrix/rank tricks, unification, entropy, half-life, Bayesian reasoning, graph theory edge cases like vertex cover, max clique/flow).\n   - Questions with ambiguous wording, especially those involving subtle NOT/EXCEPT/ONLY distinctions, or \"which of the following\" with nuanced differences.\n   - Any case where nano may confidently pick the wrong option, especially if mini is likely to succeed.\n\n3. If both models are likely to answer correctly, select nano.\n\n4. If neither model is likely to answer correctly, select mini (to avoid under-escalation and critical misroutes).\n\n5. If the question involves:\n   - Multi-step probability, information theory, or entropy calculations (e.g., bits required for accuracy, differential entropy, Bayesian inference without conditional independence), select mini.\n   - Matrix multiplication order, cost analysis, or any question requiring symbolic manipulation of formulas, select mini.\n   - Subtle protocol or network interface counting, where the answer depends on precise understanding of network architecture, escalate to mini if there is ambiguity or edge-case reasoning.\n\n6. Only select nano for questions that are obviously easy, deterministic, and not likely to trip up a small model.\n\n7. Never select nano if there is a significant risk that nano will fail but mini will succeed.\n\nEXAMPLES:\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is NOT a property of a queue?\" \u2192 mini\n- \"How many bits are required to describe the decay time of a radium atom to 3-digit accuracy, given half-life?\" \u2192 mini\n- \"Given three routers between source and destination, how many interfaces and tables are used?\" \u2192 nano if the question is direct, mini if there is ambiguity or subtlety.\n- \"Matrix multiplication order: under what condition is (A*B)*C faster than A*(B*C)?\" \u2192 mini\n\nRESPONSE FORMAT:\nRespond with exactly one token: nano or mini.\n\nDo not explain your reasoning or provide any additional text."}},
{"idx": 2, "score": 0.4325, "parents": "0", "role": "Pareto Front", "components": {"easy_router_code": "def route_easy_case(question, options, category=\"\", source=\"\"):\n    \"\"\"Return 'nano' for obvious easy cases; return 'defer' for the Qwen router.\"\"\"\n    text = (question + \"\\n\" + \"\\n\".join(options)).lower()\n\n    hard_markers = [\n        \"not\", \"except\", \"none of the above\", \"not enough information\",\n        \"which of the following\", \"i.\", \"ii.\", \"iii.\",\n        \"cache\", \"matrix\", \"rank\", \"unification\", \"boolean\", \"recurs\",\n        \"capacity\", \"entropy\", \"half-life\", \"bayesian\", \"vertex cover\",\n        \"maximum clique\", \"maximum flow\", \"chord\", \"dht\", \"nmap\",\n    ]\n    if any(marker in text for marker in hard_markers):\n        return \"defer\"\n\n    easy_markers = [\n        \"what is\", \"what are\", \"define\", \"definition\", \"stands for\",\n        \"abbreviation\", \"simple loop\", \"repeat\", \"standard fact\",\n    ]\n    if len(question) < 180 and any(marker in text for marker in easy_markers):\n        return \"nano\"\n\n    return \"defer\"\n", "router_prompt": "You are a hybrid model router for MMLU-Pro computer science multiple-choice questions. Your job is to select the cheapest model that is likely to answer the question correctly, and to escalate to a more expensive model only when necessary to avoid accuracy loss. Your routing must be risk-averse: it is much worse to select 'nano' when 'mini' would be correct and 'nano' would be wrong, than to select 'mini' unnecessarily. If both models are likely to fail, you must still select 'mini' to avoid under-escalation.\n\nYou must respond with exactly one token: nano or mini.\n\nDomain and task-specific context:\n- MMLU-Pro computer science questions cover undergraduate and AP-level computer science, including algorithms, data structures, digital logic, computer architecture, programming, discrete math, networking, security, and related topics.\n- There are two models: 'nano' (cheaper, less capable) and 'mini' (more expensive, more capable).\n- The goal is to maximize cost savings by using 'nano' whenever it is likely to answer correctly, but to avoid critical misroutes where 'nano' is chosen and gets the answer wrong while 'mini' would get it right.\n- If both models are likely to answer incorrectly, you must still select 'mini' to avoid under-escalation bias.\n\nRouting rules:\n1. Default to 'nano' for straightforward definitions, standard facts, simple code tracing, and basic algorithm questions.\n2. Escalate to 'mini' for questions involving:\n   - Multi-step calculations or multi-part reasoning (e.g., signal processing, multi-stage logic, multi-value complement, or multi-variable analysis).\n   - Tricky formal logic, subtle architecture or protocol distinctions, or dense reasoning.\n   - Ambiguous wording, especially with subtle NOT/EXCEPT/None of the above distinctions.\n   - Questions that require careful error analysis, edge-case handling, or where common misconceptions may cause 'nano' to confidently select the wrong answer.\n   - Any question where both models are likely to fail, to avoid under-escalation.\n3. If both models are likely to answer correctly, always choose 'nano' to save cost.\n4. If neither model is likely to answer correctly, choose 'mini' (never 'nano' in this case).\n5. Do not escalate to 'mini' unnecessarily; only do so when there is a clear risk that 'nano' will fail and 'mini' will succeed, or both will fail.\n\nExamples:\n- \"What is the definition of a stack?\" \u2192 nano\n- \"Which of the following is NOT a property of a binary search tree?\" \u2192 mini (subtle NOT)\n- \"Given the code below, what is the output after 5 iterations?\" (simple loop) \u2192 nano\n- \"Given a signal f(t)=3sin(200\u03c0t)+6sin(400\u03c0t)+sin(500\u03c0t), what is the minimum sampling frequency...?\" \u2192 mini (multi-step calculation, signal processing)\n- \"Obtain the 15's and 16's complement of the following hexadecimal numbers...\" \u2192 mini (multi-step, error-prone calculation)\n- \"Which of the following statements about floating-point arithmetic is NOT true?\" \u2192 mini (subtle NOT, tricky domain knowledge)\n- \"What is the time complexity of binary search?\" \u2192 nano\n\nInstructions:\n- Carefully consider whether the question is a straightforward recall or requires multi-step reasoning, error-prone calculation, or subtle logic.\n- If there is any ambiguity, subtlety, or multi-step reasoning required, or if the question is known to be failure-prone for smaller models, escalate to 'mini'.\n- If the question is a basic fact, definition, or simple code tracing, select 'nano'.\n- Always respond with exactly one token: nano or mini."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.49)", fillcolor=cyan, tooltip=" "];
    1 [label="1\\n(0.45)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.43)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
